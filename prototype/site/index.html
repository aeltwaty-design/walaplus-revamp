<title>WalaPlus Final UI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
@font-face{font-family:"Expo Arabic";src:url(fonts/expo-medium.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"Expo Arabic";src:url(fonts/expo-bold.otf) format("opentype");font-weight:700;font-display:swap}
@font-face{font-family:"NaN SuperX";src:url(fonts/nan-regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"NaN SuperX";src:url(fonts/nan-medium.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"NaN SuperX";src:url(fonts/nan-semibold.ttf) format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:"NaN SuperX";src:url(fonts/nan-bold.ttf) format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Noto Emoji";src:url(fonts/noto-emoji.woff2) format("woff2");font-weight:500;font-display:block}
:root{
  --bg:#eef3f0;--panel:#ffffff;--ink:#0d1714;--muted:#5d6b66;--line:#dbe4df;
  --chip:#f1f5f3;--chip-on:#0d1714;--chip-on-ink:#00ffa8;--accent:#00c785;--shadow:0 18px 50px rgba(10,40,30,.16);
  --body:"NaN SuperX","Expo Arabic",system-ui,sans-serif;--ar:"Expo Arabic","NaN SuperX",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1110;--panel:#141c1a;--ink:#e9f2ee;--muted:#93a39d;--line:#24302c;
  --chip:#1c2623;--chip-on:#00ffa8;--chip-on-ink:#06110d;--accent:#00ffa8;--shadow:0 18px 50px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  --bg:#0b1110;--panel:#141c1a;--ink:#e9f2ee;--muted:#93a39d;--line:#24302c;
  --chip:#1c2623;--chip-on:#00ffa8;--chip-on-ink:#06110d;--accent:#00ffa8;--shadow:0 18px 50px rgba(0,0,0,.5);}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));}
.app{display:flex;gap:28px;justify-content:center;align-items:flex-start;min-height:calc(100vh - 32px)}
.stage{flex:0 0 auto;position:sticky;top:16px}
.phone-wrap{position:relative}
.phone{position:relative;width:390px;height:844px;border-radius:0;overflow:hidden;background:#000;
  box-shadow:var(--shadow),0 0 0 10px #0b0f0e,0 0 0 11px #2a3330;transform-origin:top left;direction:rtl;
  font-family:var(--ar);-webkit-user-select:none;user-select:none}
.under{font-size:12px;color:var(--muted);text-align:center;margin-top:22px}
/* panel */
.panel{flex:0 1 340px;min-width:280px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 18px 14px;box-shadow:var(--shadow)}
.panel h1{font-size:17px;margin:0 0 2px;font-weight:700}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.45}
.grp{margin:0 0 14px}
.grp>label:not(.sw){display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 11px;cursor:pointer;line-height:1.1}
.seg button.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent;font-weight:700}
.seg button small{display:block;font-size:10.5px;opacity:.7;font-weight:400;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;margin:4px 0}
.sw input{accent-color:var(--accent);width:16px;height:16px}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
summary{cursor:pointer;font-weight:700;font-size:13px;margin-bottom:8px}
.idx{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;max-height:320px;overflow:auto}
.idx button{all:unset;cursor:pointer;font-size:12px;padding:4px 6px;border-radius:8px;color:var(--ink)}
.idx button:hover{background:var(--chip)}
.idx b{display:block;grid-column:1/-1;font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
.crumb{font-size:12px;color:var(--muted);margin:10px 0 0;min-height:16px}
@media (max-width:760px){.app{flex-direction:column;align-items:center}.stage{position:static}.panel{width:100%;flex-basis:auto}}

/* app layers */
.layer{position:absolute;inset:0;overflow:hidden;isolation:isolate;z-index:0}
.layer.page{background:#fff}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.canvas{position:relative;width:390px;background-repeat:no-repeat;background-size:390px auto}
.seg-a,.seg-b{position:relative;width:390px;background-repeat:no-repeat;background-size:390px auto}
.spacer{height:0;background-size:100% 100%;transition:height .32s cubic-bezier(.3,.7,.2,1)}
.hs{position:absolute;cursor:pointer;border-radius:12px;z-index:5}
.show-hs .hs,.hint .hs{outline:2px solid rgba(0,200,140,.85);background:rgba(0,255,168,.16)}
.hint .hs{animation:hint .7s ease}
@keyframes hint{0%,100%{opacity:0}30%,70%{opacity:1}}
.fixed{position:absolute;left:0;width:390px;background-repeat:no-repeat;background-size:100% auto;z-index:20}
.rail{position:absolute;left:0;width:390px;overflow-x:auto;overflow-y:hidden;direction:rtl;scrollbar-width:none;z-index:4;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail.snap{scroll-snap-type:x mandatory;scroll-padding-inline:16px}
.rail .inner{position:relative;direction:ltr;background-repeat:no-repeat;background-size:100% 100%}
.rail .inner .snap-pt{scroll-snap-align:start}
.rail.mq{overflow:hidden;width:390px;box-sizing:border-box;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.mq-track{position:absolute;width:0;will-change:transform}
.mq-copy{position:absolute;top:0;background-repeat:no-repeat}
/* code sticker (makeSticker): covers the whole code and keeps peeling back to show the last 3 characters */
.sk{position:absolute;z-index:4;pointer-events:none}
.sk i{display:block;font-style:normal;position:absolute}
.sk-under{position:absolute;background:var(--pri-tint);overflow:hidden}
.layer{--pri:#00ffa8;--pri-deep:#00c785;--pri-tint:#e6fff5}
.layer.cl2{--pri:#47a1c1;--pri-deep:#2f86a6;--pri-tint:#edf6f9}   /* Aramco, Figma "Client theme · colours" */
.sk-under b{position:absolute;font:700 24px/32px "Expo Arabic",sans-serif;color:#111;direction:ltr;white-space:nowrap}
.sk-cover{position:absolute;background:#111}
.sk-cover i{background-size:100% 100%}
.sk-shade{display:none}
.sk-flapw{position:absolute;left:-12px;top:-12px;right:-12px;bottom:-12px;filter:drop-shadow(-2px 2px 3px rgba(0,0,0,.3))}
.sk-flapw .sk-flap{inset:0;display:none}
.sk.c .sk-under,.sk.c .sk-shade,.sk.c .sk-flapw{display:none}
.sav{position:absolute;left:16px;width:196px;height:104px;background-size:100% 100%;z-index:3;pointer-events:none}
.sav svg{display:block}
/* Today's pick deck (makeDeck): HTML cards behind the Samsung flip card */
.tpc{position:absolute;width:398px;height:403px;z-index:6;touch-action:pan-y;display:none}
.tpc.on,.tpc.next{display:block}
.flip.tpc-flip:not(.on):not(.next){display:none}
.flip.next{z-index:5}
.flip.tpc-flip:not(.busy):not(.flipped) .face.front{opacity:1}   /* the deck moves it, so draw the front itself rather than rely on the Home image under it */
.tpc.next{z-index:5}
.tpc-card{position:absolute;left:20px;top:14px;width:358px;height:363px;background:#fff;border-radius:20px;box-shadow:0 4px 18px rgba(18,18,18,.06);overflow:hidden;direction:rtl}
.tpc-ph{position:absolute;left:8px;top:8px;width:342px;height:221px;border-radius:16px;background:#ddd center/cover no-repeat}
.tpc-fl{position:absolute;left:16px;top:16px;width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#111}
.tpc-fl .ic,.tpc-meta .ic{display:block;width:18px;height:18px}
.tpc-fl .ic svg,.tpc-meta .ic svg{width:18px;height:18px;stroke-width:2;display:block}
.tpc-tag{position:absolute;left:16px;top:197px;height:24px;width:78px;text-align:center;border-radius:12px;background:rgba(17,17,17,.7);color:#fff;font:700 12px/24px "NaN SuperX","Expo Arabic",sans-serif;white-space:nowrap}
.tpc-lg{position:absolute;left:275px;top:16px;width:67px;height:56px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center}
.tpc-lg i{display:block;width:55.4px;height:45px;background:center/contain no-repeat}
.tpc-m{position:absolute;left:16px;top:245px;width:326px;font:400 12px/16px "NaN SuperX","Expo Arabic",sans-serif;color:#62625c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpc-t{position:absolute;left:16px;top:266px;width:326px;font:700 16px/24px "NaN SuperX","Expo Arabic",sans-serif;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpc-d{position:absolute;right:16px;top:297px;height:24px;padding:0 8px;border-radius:12px;background:#00ffa8;color:#111;font:700 12px/24px "NaN SuperX","Expo Arabic",sans-serif;white-space:nowrap}
.tpc-meta{position:absolute;right:16px;top:329px;height:18px;display:flex;align-items:center;gap:4px;color:#62625c;font:400 12px/16px "NaN SuperX","Expo Arabic",sans-serif;white-space:nowrap}
.tpc-meta b{font-weight:400;margin:0 4px}
.tpdots{z-index:6}
/* voucher values on merchant C1 (makeVouPick) */
.vp{position:absolute;z-index:4}
.vp-val{background:#111;overflow:hidden;pointer-events:none}
.vp-num{position:absolute;right:0;top:0;height:100%;display:flex;align-items:center;gap:6.3px;direction:ltr;color:#fff;font:700 36px/44px "NaN SuperX",sans-serif;transition:opacity .2s,transform .2s}
.vp-num .riyal{width:26px;height:29.5px}
.vp-num.out{opacity:0;transform:translateY(-10px)}
.vp-num.in{opacity:0;transform:translateY(10px);transition:none}
.vp-chips{background:#fff}
.vp-chips button{all:unset;box-sizing:border-box;position:absolute;top:0;height:38px;border:1px solid #e6e6df;border-radius:999px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;gap:2.8px;direction:ltr;
  font:600 15px/18px "NaN SuperX",sans-serif;cursor:pointer;transition:background .2s,color .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.vp-chips button.on{background:#111;border-color:#111;color:#fff}
.vp-chips button i{font:600 12.5px/16px "NaN SuperX",sans-serif;font-style:normal;color:#009e6a;margin-right:3px}
.vp-chips button.on i{color:#00ffa8}
.vp-chips .riyal{width:10.7px;height:11.8px;position:relative;top:-.65px}
.vp-price{background:#fff;pointer-events:none}
.vp-pr{position:absolute;right:0;top:0;height:100%;display:flex;align-items:center;direction:rtl;color:#111}
.vp-pr b{font:700 20px/25px "NaN SuperX",sans-serif;margin-left:3px}
.vp-pr img{width:24px;height:25px;display:block}
.vp-pr s{font:400 16px/16px "NaN SuperX",sans-serif;color:#62625c;margin-right:8px;position:relative;top:.67px}
.vp-pr em{font:600 12.5px/16px "NaN SuperX",sans-serif;font-style:normal;background:#00ffa8;color:#111;border-radius:999px;height:20px;width:76px;justify-content:center;display:flex;align-items:center;margin-right:8px;white-space:nowrap}
/* Afiya cover on merchant C1 (makeCover) */
.cv{position:absolute;left:0;top:0;width:390px;height:330px;z-index:4;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cv i{display:block;font-style:normal}
.cv-clip{position:absolute;inset:0;overflow:hidden;clip-path:path('M0 0H390V330A28 28 0 0 0 362 302H28A28 28 0 0 0 0 330Z')}
.cv-ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;background-color:#e7713a;opacity:0;transition:opacity .6s ease}
.cv-ph.on{opacity:1;transform:scale(1.05);transition:opacity .6s ease,transform 3.4s linear}
.cv-ph.reset{transition:none!important}
.cv-scrim{position:absolute;left:0;top:0;width:390px;height:150px;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,0))}
.cv-sheet{position:absolute;left:0;top:302px;width:390px;height:120px;border-radius:28px 28px 0 0;box-shadow:0 -8px 24px rgba(18,18,18,.14)}
.cv-logo{position:absolute;left:306.67px;top:262.67px;width:69.67px;height:69.67px;border-radius:20.9px;background-size:100% 100%;box-shadow:0 7px 23px rgba(18,18,18,.14)}
.cv-sb{position:absolute;left:0;top:0;width:390px;height:42px;pointer-events:none}
.cv-sb svg{position:absolute;left:24px;top:14px}
.cv-sb b{position:absolute;left:338px;top:16px;font:600 15px/18px "NaN SuperX",sans-serif;color:#fff}
.cv-seg i{position:absolute;top:50px;width:68px;height:3px;border-radius:1.5px;background:rgba(255,255,255,.45);overflow:hidden;pointer-events:none}
.cv-seg b{position:absolute;right:0;top:0;height:100%;width:0;background:#fff}
.cv-btn{position:absolute;top:64px;height:40px;border-radius:20px;background-size:100% 100%;box-shadow:0 6px 20px rgba(18,18,18,.14)}
.cv-chip{position:absolute;left:16px;top:264px;width:74px;height:26px;box-sizing:border-box;padding:5px 10px;display:flex;justify-content:flex-end;align-items:center;gap:4px;border-radius:999px;
  background:rgba(17,17,17,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);color:#fff;font:500 12.5px/16px "NaN SuperX","Expo Arabic",sans-serif;direction:ltr;white-space:nowrap;pointer-events:none}
.cv-chip span{direction:rtl;position:relative;top:1px}
.cv-chip svg{flex:none;display:block}
.cv-zone{position:absolute;top:0;height:302px;width:195px;border-radius:0}
@media (prefers-reduced-motion:reduce){.cv-ph.on{transform:none}}
/* Home search: "ابحث عن" stays, the rest rolls (makeSearchRoll) */
.sx{position:absolute;left:32px;width:290px;height:28px;background:#fff;direction:rtl;display:flex;align-items:center;pointer-events:none;z-index:4;
  font:500 14px/20px "NaN SuperX","Expo Arabic",sans-serif;color:#62625c;white-space:nowrap}
.sx-fix{flex:none}
.sx-roll{position:relative;flex:1;height:28px;overflow:hidden}
.sx-w{position:absolute;right:0;top:4px;line-height:20px;opacity:0;transform:translateY(105%);
  transition:transform .55s cubic-bezier(.22,.9,.3,1),opacity .35s ease}
.sx-w.on{opacity:1;transform:none;transition:transform .55s cubic-bezier(.22,.9,.3,1),opacity .45s ease .08s}
.sx-w.out{opacity:0;transform:translateY(-105%)}
.sx-w.reset{transition:none}
.sx-w i{font:500 16px/20px "Noto Emoji",sans-serif;font-style:normal;color:#111;display:inline-block;vertical-align:top;margin-inline-start:3px}
@media (prefers-reduced-motion:reduce){.sx-w,.sx-w.out{transform:none}}
.dragging,.dragging *{cursor:grabbing!important}
.sticky{position:absolute;top:0;left:0;width:390px;height:153px;z-index:21;background-size:100% 100%;
  transform:translateY(-100%);transition:transform .25s ease}
.sticky.on{transform:none}
/* sheets */
.layer.sheet{background:transparent}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.layer.sheet.in .scrim{opacity:1}
.panel-sheet{position:absolute;left:0;bottom:0;width:390px;height:748px;background-size:100% 100%;
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.layer.sheet.in .panel-sheet{transform:none}
/* page transitions */
.layer.page{transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .25s}
.layer.page.from-left{transform:translateX(-100%)}
.layer.page.from-bottom{transform:translateY(100%)}
.layer.page.from-sheet{transform:translateY(96px);opacity:0}
.layer.page.fade{opacity:0}
.layer.page.behind{transform:translateX(28%)}
/* toast */
.toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,20px);background:rgba(17,17,17,.92);color:#fff;
  font:500 14px var(--ar);padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:99;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* flip */
.flip{position:absolute;perspective:1400px;z-index:6}
.flip .under-bg{position:absolute;left:20px;top:14px;width:358px;height:363px;border-radius:28px;opacity:0;transition:opacity .1s}
.flip.busy .under-bg,.flip.flipped .under-bg{opacity:1}
.flip .card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.flip.flipped .card{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-size:100% 100%}
.flip .back{transform:rotateY(180deg)}
.flip:not(.busy):not(.flipped) .face.front{opacity:0}
.flip.flipped .face.front,.flip:not(.flipped) .face.back{pointer-events:none}   /* a hidden face must not catch taps meant for the one in view */
/* balance */
.bal{position:absolute;left:16px;top:105px;width:362px;height:242px;background-size:100% 100%;z-index:7;
  clip-path:inset(0 0 152px 0 round 24px);opacity:0;transition:clip-path .32s cubic-bezier(.3,.7,.2,1),opacity .15s;pointer-events:none}
.bal.on{clip-path:inset(0 0 0 0 round 24px);opacity:1;pointer-events:auto}
/* peel */
.peel{position:absolute;z-index:8;overflow:hidden;border-radius:14px;pointer-events:none}
.peel .u,.peel .c{position:absolute;inset:0;background-repeat:no-repeat}
.peel .c{transform-origin:0% 100%}
.peel.go .c{animation:peel .75s cubic-bezier(.5,0,.3,1) forwards}
@keyframes peel{0%{transform:none}35%{transform:translate(-4px,-6px) rotate(-5deg)}100%{transform:translate(-420px,40px) rotate(-22deg);opacity:.2}}
.codebox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--pri-tint);border:1.5px dashed var(--pri-deep);border-radius:14px;
  font:700 24px "NaN SuperX",monospace;letter-spacing:.18em;color:#0d1714}
/* scanner */
.scanline{position:absolute;left:65px;top:210px;width:260px;height:260px;z-index:6;pointer-events:none;overflow:hidden;border-radius:18px}
.scanline::after{content:"";position:absolute;left:8%;right:8%;height:3px;top:0;background:#00ffa8;box-shadow:0 0 18px 4px rgba(0,255,168,.7);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 3px)}}
.clock{position:absolute;left:134px;top:47px;width:58px;height:19px;background:#111;color:#fff;z-index:6;direction:rtl;
  font:700 13px/19px "NaN SuperX",sans-serif;text-align:left;pointer-events:none;white-space:nowrap}
.sel-ring{position:absolute;border:2.5px solid #00c785;border-radius:18px;z-index:6;pointer-events:none}
.heart{position:absolute;z-index:6;pointer-events:none;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff}
/* banner carousel dots, drawn over the still image so they follow the auto-rotation */
.cdots{position:absolute;left:0;width:390px;height:12px;display:flex;justify-content:center;align-items:center;gap:8px;direction:rtl;z-index:4;pointer-events:none}
.cdots i{width:5px;height:5px;border-radius:50%;background:#c4c4c4;transition:.25s}
.cdots i{width:5.33px;height:5.33px}

/* small screens: the phone fills the screen, the controls open from a pill at the top */
.ctl{display:none}
body.full{padding:0;overflow:hidden;background:#000;overscroll-behavior:none}
body.full .app{display:block;min-height:0}
body.full .stage{position:static}
body.full .under{display:none}
body.full .phone{border-radius:0;box-shadow:none}
body.full .panel{display:none}
body.full.ctl-open .panel{display:block;position:fixed;inset:0;z-index:60;border:0;border-radius:0;overflow:auto;padding-top:calc(52px + env(safe-area-inset-top,0px));min-width:0}
body.full .ctl{display:flex;position:fixed;z-index:61;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);height:26px;padding:0 11px;align-items:center;gap:6px;border:0;border-radius:13px;
  background:rgba(13,23,20,.6);color:#fff;font:700 11.5px/1 var(--body);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer}
body.full .ctl svg{width:14px;height:14px}
body.full.ctl-open .ctl{background:var(--chip-on);color:var(--chip-on-ink)}
/* ===== Edge cases: HTML states drawn in the Final UI style ===== */
.phone{--aqua:#00FFA8;--ink:#111111;--mut:#62625c;--mint:#EEF6F2;--line:#E3EAE6;--dark:#072928;
  --t-amber:#FFF1C7;--f-amber:#B7791F;--t-violet:#EFE7FF;--f-violet:#7C3AED;--t-cyan:#DDF6FB;--f-cyan:#0E7490;
  --t-grey:#ECEFED;--f-grey:#3F3F3A;--t-red:#FFE3E3;--f-red:#C0392B;--t-mint:#D9FBEC;--f-mint:#0B8F5E}
.ic{display:inline-block;width:1em;height:1em;flex:none;vertical-align:-.15em}
.ic svg{width:100%;height:100%;display:block}
.ar{font-family:"NaN SuperX","Expo Arabic",system-ui,sans-serif;direction:rtl}
.disp{font-family:"Expo Arabic","NaN SuperX",sans-serif;font-weight:700}

/* bottom sheet built in HTML */
.panel-sheet.auto{height:auto;max-height:780px;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px 30px;
  box-shadow:0 -10px 40px rgba(0,0,0,.12);overflow:auto;scrollbar-width:none}
.grab{width:36px;height:5px;border-radius:3px;background:#D9DFDB;margin:0 auto 18px}
.e-icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px}
.tone-amber{background:var(--t-amber);color:var(--f-amber)}.tone-violet{background:var(--t-violet);color:var(--f-violet)}
.tone-cyan{background:var(--t-cyan);color:var(--f-cyan)}.tone-grey{background:var(--t-grey);color:var(--f-grey)}
.tone-red{background:var(--t-red);color:var(--f-red)}.tone-mint{background:var(--t-mint);color:var(--f-mint)}
.e-title{font:700 20px/1.35 "Expo Arabic",sans-serif;color:var(--ink);text-align:center;margin:0 0 8px}
.e-body{font:400 14px/1.65 "NaN SuperX","Expo Arabic",sans-serif;color:var(--mut);text-align:center;margin:0 auto 20px;max-width:330px}
.e-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border:0;border-radius:28px;
  background:var(--aqua);color:var(--ink);font:700 17px "Expo Arabic",sans-serif;cursor:pointer;direction:rtl}
.e-btn .ic{font-size:22px}
.e-btn.ink{background:var(--ink);color:#fff}
.e-btn.ghost{background:#fff;border:1.5px solid var(--ink)}
.e-btn.off{background:#E3E8E5;color:#8B928E;cursor:not-allowed}
.e-btn:active{transform:scale(.98)}
.e-link{display:block;width:100%;height:44px;margin-top:6px;border:0;background:none;color:var(--ink);font:500 15px "NaN SuperX","Expo Arabic",sans-serif;cursor:pointer}
.e-list{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:14px}
.e-list li{display:flex;gap:12px;align-items:flex-start;font:400 14px/1.6 "NaN SuperX",sans-serif;color:var(--ink);text-align:right}
.e-list li .e-mini{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.e-list li b{font-weight:700;display:block}
.e-list li div>span{color:var(--mut)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* overlays placed on image screens */
.ov{position:absolute;z-index:9;direction:rtl;font-family:"NaN SuperX","Expo Arabic",sans-serif}
.ov-card{position:absolute;border-radius:20px;background:#fff;box-shadow:0 6px 20px rgba(10,40,30,.06);display:flex;align-items:center;gap:12px;padding:12px 16px;box-sizing:border-box}
.ov-card .e-mini{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.ov-card .tx{flex:1;min-width:0}
.ov-card .tx b{display:block;font:700 15px/1.4 "Expo Arabic",sans-serif;color:var(--ink)}
.ov-card .tx span{display:block;font:400 12.5px/1.5 "NaN SuperX",sans-serif;color:var(--mut)}
.ov-pill{flex:none;height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--aqua);color:var(--ink);font:700 13px "Expo Arabic",sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px}
.ov-pill.ink{background:var(--ink);color:#fff}
.ov-pill.line{background:#fff;border:1.5px solid var(--ink)}
.ov-text{position:absolute;font:400 12.5px/20px "NaN SuperX",sans-serif;color:var(--mut);text-align:right;white-space:nowrap;overflow:hidden}
.ov-text.warn{color:#A0610D}
.ov-loc{position:absolute;border-radius:24px;overflow:hidden;color:#fff;padding:22px 20px;box-sizing:border-box;
  background:radial-gradient(120% 90% at 85% 0%,rgba(0,255,168,.28),transparent 60%),linear-gradient(160deg,#0B3B36,#061B19 70%)}
.ov-loc .grid{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:28px 28px;
  -webkit-mask-image:radial-gradient(80% 80% at 30% 60%,#000,transparent);mask-image:radial-gradient(80% 80% at 30% 60%,#000,transparent)}
.ov-loc .pin{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--aqua);position:relative}
.ov-loc b{display:block;font:700 20px/1.35 "Expo Arabic",sans-serif;margin:14px 0 6px;position:relative}
.ov-loc p{margin:0 0 16px;font:400 13.5px/1.6 "NaN SuperX",sans-serif;color:rgba(255,255,255,.75);position:relative;max-width:290px}
.ov-loc .ov-pill{position:relative;height:44px;border-radius:22px;padding:0 18px;font-size:15px}

/* offer state: notice card above the main button, swapped button, grey hero */
.ov-notice{position:absolute;left:16px;right:16px;border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:12;
  box-shadow:0 8px 24px rgba(0,0,0,.08);direction:rtl}
.ov-notice .ic{font-size:22px}
.ov-notice b{display:block;font:700 14.5px/1.4 "Expo Arabic",sans-serif;color:var(--ink)}
.ov-notice div>span{display:block;font:400 12.5px/1.5 "NaN SuperX",sans-serif;color:#4b4b46}
.ov-notice.amber{background:#FFF6DB;color:var(--f-amber)}.ov-notice.grey{background:#F1F3F2;color:#55554f}
.ov-notice.cyan{background:#E6F8FC;color:var(--f-cyan)}.ov-notice.red{background:#FFECEC;color:var(--f-red)}
.ov-cta{position:absolute;z-index:13;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 17px "Expo Arabic",sans-serif;cursor:pointer;direction:rtl}
.ov-cta .ic{font-size:22px}
.ov-cta.off{background:#E3E8E5;color:#8B928E}
.ov-cta.aqua{background:var(--aqua);color:var(--ink)}
.ov-cta.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.ov-gray{position:absolute;z-index:8;border-radius:24px;backdrop-filter:grayscale(1) brightness(.8);-webkit-backdrop-filter:grayscale(1) brightness(.8);pointer-events:none}
.ov-tag{position:absolute;z-index:9;height:28px;padding:0 12px;border-radius:14px;background:#fff;color:var(--ink);font:700 12.5px/28px "Expo Arabic",sans-serif;direction:rtl}

/* favourites heart */
.ov-heart{position:absolute;z-index:9;width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;color:#F43F5E;pointer-events:none;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ov-heart.on{transform:scale(1)}
.ov-heart svg path{fill:currentColor}

/* status banner (offline etc.) */
.e-banner{position:absolute;left:50%;transform:translateX(-50%);z-index:24;height:36px;padding:0 14px;border-radius:18px;background:rgba(17,17,17,.94);color:#fff;
  display:flex;align-items:center;gap:8px;font:500 13px "NaN SuperX","Expo Arabic",sans-serif;white-space:nowrap;direction:rtl;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.e-banner .ic{font-size:16px;color:#FFB4A8}
.e-banner.ok{background:#0B3B36}.e-banner.ok .ic{color:var(--aqua)}
.e-banner button{all:unset;cursor:pointer;color:var(--aqua);font-weight:700;margin-right:4px}

/* skeleton */
.skel{position:absolute;inset:0;z-index:19;transition:opacity .25s;pointer-events:none}
.skel i{position:absolute;display:block;background:linear-gradient(90deg,#E4ECE8 0%,#F3F7F5 45%,#E4ECE8 90%);background-size:220% 100%;animation:shim 1.1s linear infinite}
.skel.dark i{background:linear-gradient(90deg,#1d2422 0%,#2b3431 45%,#1d2422 90%);background-size:220% 100%}
@keyframes shim{from{background-position:120% 0}to{background-position:-100% 0}}
.skel.gone{opacity:0}

/* HTML pages */
.hpage{position:absolute;inset:0;background:var(--mint);direction:rtl;font-family:"NaN SuperX","Expo Arabic",sans-serif;color:var(--ink);overflow:hidden}
.hpage .sb{position:absolute;top:0;left:0;width:390px;height:44px;background-size:100% 100%;z-index:3}
.hpage .hbody{position:absolute;top:44px;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none}
.hpage .hbody::-webkit-scrollbar{display:none}
.rbtn{width:40px;height:40px;border-radius:50%;background:#fff;border:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink);cursor:pointer;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.s-head{display:flex;gap:10px;align-items:center;padding:4px 16px 12px}
.s-field{flex:1;height:48px;border-radius:24px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;box-shadow:0 2px 10px rgba(10,40,30,.05)}
.s-field .ic{font-size:20px;color:var(--mut)}
.s-field input{all:unset;flex:1;font:400 15px "NaN SuperX","Expo Arabic",sans-serif;color:var(--ink);direction:rtl;min-width:0}
.s-field input::placeholder{color:#9a9a93}
.s-field .clr{all:unset;cursor:pointer;width:24px;height:24px;border-radius:50%;background:#E7ECE9;display:flex;align-items:center;justify-content:center;font-size:14px;color:#55554f}
.s-sec{padding:6px 16px 4px;display:flex;justify-content:space-between;align-items:baseline}
.s-sec h3{margin:0;font:700 17px "Expo Arabic",sans-serif}
.s-sec button{all:unset;cursor:pointer;font:500 13px "NaN SuperX",sans-serif;color:var(--mut)}
.s-chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 18px}
.s-chip{all:unset;cursor:pointer;height:36px;padding:0 14px;border-radius:18px;background:#fff;display:flex;align-items:center;gap:6px;font:500 14px "NaN SuperX",sans-serif;color:var(--ink)}
.s-chip .ic{font-size:16px;color:var(--mut)}
.s-list{display:grid;gap:10px;padding:8px 16px 40px}
.s-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:12px;cursor:pointer;box-shadow:0 6px 20px rgba(10,40,30,.05)}
.s-logo{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font:700 20px "Expo Arabic",sans-serif;flex:none}
.s-row .tx{flex:1;min-width:0}
.s-row .tx b{display:block;font:700 15.5px/1.35 "Expo Arabic",sans-serif}
.s-row .tx span{display:flex;align-items:center;gap:4px;font:400 12.5px/1.6 "NaN SuperX",sans-serif;color:var(--mut)}
.s-tag{flex:none;height:26px;padding:0 10px;border-radius:13px;font:700 12.5px/26px "Expo Arabic",sans-serif;color:var(--ink);background:var(--aqua)}
.s-tag.gold{background:#FFD23F}.s-tag.cyan{background:#7BE7F2}.s-tag.violet{background:#CDBDFF}
.s-empty{padding:40px 28px;text-align:center}
.s-empty .e-icon{width:72px;height:72px;font-size:32px}
.s-count{font:500 13px "NaN SuperX",sans-serif;color:var(--mut)}
.mark{background:rgba(0,255,168,.35);border-radius:3px;color:inherit}
.s-skel{height:76px;border-radius:20px;background:linear-gradient(90deg,#E4ECE8 0%,#F3F7F5 45%,#E4ECE8 90%);background-size:220% 100%;animation:shim 1.1s linear infinite}

/* full-page states (error, empty) */
.st-page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px 60px;text-align:center}
.st-page .e-icon{width:84px;height:84px;font-size:38px;margin-bottom:20px}
.st-page .e-btn{max-width:334px}

/* scanner states */
.cam-off{position:absolute;left:0;right:0;top:140px;bottom:0;z-index:7;background:linear-gradient(#0c0f0e 0%,#151a18 100%);display:flex;flex-direction:column;align-items:center;padding:90px 28px 0;text-align:center;direction:rtl}
.cam-off .e-icon{background:#232a27;color:#d7ddd9;width:72px;height:72px;font-size:32px}
.cam-off .e-title{color:#fff}
.cam-off .e-body{color:#a9b1ad}
.cam-off .e-link{color:#fff}
.scan-hint{position:absolute;left:16px;right:16px;bottom:96px;z-index:8;border-radius:22px;background:rgba(20,24,22,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:#fff;padding:16px;display:flex;gap:12px;align-items:center;direction:rtl;opacity:0;transform:translateY(12px);transition:.3s}
.scan-hint.on{opacity:1;transform:none}
.scan-hint .ic{font-size:24px;color:var(--aqua)}
.scan-hint b{display:block;font:700 15px "Expo Arabic",sans-serif}
.scan-hint span{display:block;font:400 12.5px/1.5 "NaN SuperX",sans-serif;color:#c3cac6}
.scan-hint .ov-pill{height:38px}

/* code entry */
.pin{display:flex;gap:8px;justify-content:center;direction:ltr;margin:4px 0 8px}
.pin i{width:44px;height:54px;border-radius:14px;background:#F2F5F3;display:flex;align-items:center;justify-content:center;font:700 24px "NaN SuperX",sans-serif;font-style:normal;color:var(--ink);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s}
.pin i.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.pin.err i{box-shadow:inset 0 0 0 2px #E5484D;background:#FFF1F1}
.pin-err{font:500 13px "NaN SuperX",sans-serif;color:#C0392B;text-align:center;min-height:20px;margin:0 0 10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px;direction:ltr}
.pad button{all:unset;cursor:pointer;height:50px;border-radius:14px;background:#F2F5F3;display:flex;align-items:center;justify-content:center;font:600 22px "NaN SuperX",sans-serif;color:var(--ink)}
.pad button:active{background:#E3E9E6}
.pad button.blank{background:none;cursor:default}

/* code expired on R2 */
.ov-expired{position:absolute;z-index:8;border-radius:0 0 4px 4px;background:rgba(255,255,255,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;direction:rtl;padding:0 24px}
.ov-expired .e-icon{width:48px;height:48px;font-size:24px;margin-bottom:8px}
.ov-expired b{font:700 17px "Expo Arabic",sans-serif;color:var(--ink)}
.ov-expired>span{font:400 12.5px/1.6 "NaN SuperX",sans-serif;color:var(--mut);margin:4px 0 10px}

/* share sheet */
.sh-card{display:flex;gap:12px;align-items:center;background:#F4F7F5;border-radius:18px;padding:12px;margin:0 0 14px}
.sh-card .s-logo{width:48px;height:48px}
.sh-card b{display:block;font:700 15px/1.4 "Expo Arabic",sans-serif}
.sh-card span{font:400 12.5px "NaN SuperX",sans-serif;color:var(--mut)}
.sh-link{display:flex;align-items:center;gap:8px;height:48px;border-radius:24px;background:#F4F7F5;padding:0 6px 0 16px;margin:0 0 18px;direction:rtl}
.sh-link code{flex:1;font:500 14px "NaN SuperX",monospace;direction:ltr;text-align:right;color:var(--ink)}
.sh-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 8px}
.sh-apps button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12.5px "NaN SuperX",sans-serif;color:var(--ink)}
.sh-apps i{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-style:normal}

/* iOS-style system alert */
.sysalert{position:absolute;inset:0;z-index:95;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.sysalert.on{opacity:1}
.sysalert .box{width:272px;border-radius:14px;background:rgba(242,242,242,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);text-align:center;direction:rtl;overflow:hidden;
  transform:scale(1.08);transition:transform .2s;font-family:-apple-system,"SF Pro Text","NaN SuperX",sans-serif}
.sysalert.on .box{transform:none}
.sysalert .box .bd{padding:18px 16px 14px}
.sysalert b{display:block;font-size:16px;font-weight:600;color:#000;margin-bottom:4px;line-height:1.35}
.sysalert p{margin:0;font-size:13px;line-height:1.45;color:#222}
.sysalert .mapimg{height:110px;margin:12px 0 0;border-radius:10px;background:radial-gradient(circle at 50% 55%,#2b7cff 0 5px,rgba(43,124,255,.25) 6px 22px,transparent 23px),linear-gradient(135deg,#e8efe6,#d6e4d3);position:relative}
.sysalert button{all:unset;display:block;width:100%;box-sizing:border-box;padding:11px;border-top:.5px solid rgba(60,60,67,.29);color:#0A7AFF;font-size:16.5px;cursor:pointer}
.sysalert button.b{font-weight:600}
.sysalert button:active{background:rgba(0,0,0,.06)}

/* panel extras */
.edge-on{display:grid;gap:6px}
.edge-on button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--chip);border:1px solid var(--line);color:var(--ink)}
.edge-on button:hover{border-color:var(--accent)}
.edge-on button small{color:var(--muted);font-size:11px;white-space:nowrap}
.edge-on .none{font-size:12.5px;color:var(--muted)}
.seg.small button{padding:6px 9px;font-size:12px}

/* report reasons */
.rs{display:grid;gap:10px;margin:0 0 18px}
.rs button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;box-shadow:inset 0 0 0 1.5px var(--line);font:500 14.5px/1.4 "NaN SuperX","Expo Arabic",sans-serif;color:var(--ink);direction:rtl;text-align:right}
.rs button i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px #C5CDC9;flex:none}
.rs button.on{box-shadow:inset 0 0 0 2px #00C785;background:#F2FFF9}

.st-chip small{font:500 12px/16px "NaN SuperX",sans-serif;color:#62625c}
.st-chip i.dot{width:8px;height:8px;border-radius:50%}
.st-chip.on{background:#111;color:#fff;font-weight:600;box-shadow:none}
.st-chip.on small{color:#c1c1bc}
.st-chip.on.gold{background:#fcc128;color:#111}.st-chip.on.gold small{color:rgba(17,17,17,.6)}
.st-chip.on.aqua{background:#00ffa8;color:#111}.st-chip.on.aqua small{color:rgba(17,17,17,.6)}
.st-chip.zero{opacity:.45}
.st-chip .x{font-size:16px;margin-inline-start:-2px}
.st-chip .cic{width:24px;height:24px;background-size:100% 100%}
.st-chip.tinted{box-shadow:none}
.st-chip.grid{width:40px;padding:0;justify-content:center;background:#f0f8f3;box-shadow:none;font-size:22px}
/* category tiles */
.st-tiles{height:96px;padding-top:16px;gap:12px;align-items:flex-start}
.st-tiles button{flex:none;height:80px;background-size:100% 100%}
/* path */
.st-path{height:36px;padding:16px 16px 0;display:flex;align-items:center;gap:4px;font:500 14px/20px "NaN SuperX",sans-serif;color:#62625c}
.st-path button{color:#62625c;font-weight:500;white-space:nowrap}
.st-path button.cur{color:#111;font-weight:600}
.st-path .ic{font-size:18px;color:#62625c}
.st-path .clr{margin-right:auto;display:flex;align-items:center;gap:4px;color:#00cc88;font-weight:500}
.st-path .clr .ic{color:#00cc88;font-size:18px}
/* strips */
.st-strip{position:relative;background-size:100% 100%;cursor:pointer}
.st-switch{position:absolute;left:32px;top:36px;width:56px;height:32px;border-radius:16px;background:#111;transition:background .2s}
.st-switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.st-switch.off{background:#d6dbd8}
.st-switch.off::after{left:28px}
/* toolbar */
.st-tool{height:64px;padding:24px 16px 0;display:flex;align-items:center;gap:8px}
.st-tool h2{margin:0;font:700 20px/28px "Expo Arabic",sans-serif;color:#111;white-space:nowrap}
.st-count{height:24px;min-width:24px;padding:0 8px;border-radius:500px;background:#fff;font:600 12px/24px "NaN SuperX",sans-serif;text-align:center}
.st-sort{margin-right:auto;height:40px;padding:0 8px;border-radius:500px;background:#fff;box-shadow:0 1px 3px rgba(18,18,18,.08);display:flex;align-items:center;gap:4px;font:500 14px/20px "NaN SuperX",sans-serif;white-space:nowrap}
.st-sort .ic{font-size:24px}
.st-sort .ic:first-child{font-size:20px;padding:2px}
.st-filter{position:relative;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(18,18,18,.08);display:flex;align-items:center;justify-content:center;font-size:24px}
.st-filter b{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:#00ffa8;color:#111;font:700 11px/18px "NaN SuperX",sans-serif;padding:0 4px}
.st-active{padding-top:12px;height:52px}
.st-active .st-chip{height:36px;padding:0 12px;font-size:13px}
/* rows */
.st-list{padding:16px 16px 0}
.st-row{position:relative;display:flex;gap:16px;padding:8px;height:128px;margin-bottom:8px;background:#fff;border-radius:20px;box-shadow:0 6px 20px rgba(18,18,18,.06);cursor:pointer}
.st-ph{flex:none;width:133px;height:112px;border-radius:16px;background-size:100% 100%}
.st-info{width:193px;min-width:0;display:flex;flex-direction:column}
.st-name{display:flex;align-items:center;gap:8px;height:24px}
.st-name b{font:700 16px/24px "NaN SuperX",sans-serif;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-ad{flex:none;height:24px;padding:0 8px;border-radius:500px;background:#eef6f1;color:#62625c;font:500 12px/24px "NaN SuperX",sans-serif}
.st-heart{flex:none;margin-right:auto;width:28px;height:28px;margin-left:-6px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#111}
.st-heart.on{color:#ff4d6d}
.st-heart.on svg{fill:#ff4d6d}
.st-heart.pop{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.35)}}
.st-cat{margin-top:4px;font:400 12px/16px "NaN SuperX",sans-serif;color:#62625c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-meta{margin-top:4px;display:flex;align-items:center;gap:4px;height:18px;font:400 12px/16px "NaN SuperX",sans-serif;color:#62625c;white-space:nowrap}
.st-meta .ic{font-size:18px}
.st-meta .star{color:#fcc128}.st-meta .star svg{fill:#fcc128}
.st-meta b{font-weight:600;color:#111}
.st-meta em{font-style:normal;font-weight:500}
.st-tags{margin-top:auto;height:32px;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
.st-tags::-webkit-scrollbar{display:none}
.st-tags.more{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 24px);mask-image:linear-gradient(to right,transparent 0,#000 24px)}
.st-tag{flex:none;height:32px;padding:0 16px;border-radius:500px;display:flex;align-items:center;gap:4px;font:700 12px/16px "NaN SuperX",sans-serif;color:#111;white-space:nowrap}
.st-tag.disc{background:#00ffa8}.st-tag.bogo{background:#fcc128}.st-tag.cb{background:#00def9}.st-tag.vou{background:#bb8fff}
.st-tag:active{transform:scale(.96)}
.riyal{width:9px;height:10px;fill:currentColor;flex:none}
/* bands + nudge */
.st-band{position:relative;margin:16px -16px 24px;width:390px}
.st-band .bg{height:88px;background-size:100% auto;background-repeat:no-repeat}
.st-band.a .bg{height:149px;margin-bottom:-61px}
.st-band .see{position:absolute;left:16px;top:24px;width:32px;height:32px;border-radius:50%}
.st-band .st-hrow{gap:8px}
.st-band .st-hrow button{flex:none;width:160px;height:172px;background-size:100% 100%}
.st-nudge{position:relative;margin:0 -16px 8px;width:390px;height:152px;margin-top:-8px;background-size:100% 100%}
.st-nudge button{position:absolute;height:40px;border-radius:20px}
.st-more{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;color:#62625c;font:500 13px "NaN SuperX",sans-serif}
.st-more .ic{font-size:22px}
.st-more button{height:36px;padding:0 14px;border-radius:18px;background:#111;color:#fff;font:700 13px "Expo Arabic",sans-serif}
.st-skel{height:128px;margin-bottom:8px;border-radius:20px;background:linear-gradient(90deg,#E4ECE8 0%,#F3F7F5 45%,#E4ECE8 90%);background-size:220% 100%;animation:shim 1.1s linear infinite}
.st-empty{margin:4px 0 0;padding:28px 20px 24px;background:#fff;border-radius:20px;text-align:center;box-shadow:0 6px 20px rgba(18,18,18,.06)}
.st-empty .e-icon{width:64px;height:64px;font-size:28px}
.st-empty .e-body{margin-bottom:16px}
.st-empty .e-btn{max-width:260px;margin:0 auto;height:48px}
/* sticky header */
.st-sticky{position:absolute;left:0;top:0;width:390px;z-index:21;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-radius:0 0 24px 24px;box-shadow:0 6px 20px rgba(18,18,18,.08);transform:translateY(-105%);transition:transform .25s ease}
.st-sticky.on{transform:none}
.st-sticky .sb{height:33px;background-size:100% 100%}
.st-sticky .st-lensrow{padding:8px 16px 0;height:56px}
.st-sticky .st-hrow{padding-top:8px;padding-bottom:16px;height:64px}
/* fixed parts */
.st-pill{position:absolute;z-index:20;background-size:100% 100%;cursor:pointer}
.st-pill .half{position:absolute;top:0;bottom:0}
/* sheets */
.st-opts{list-style:none;margin:0 0 12px;padding:0}
.st-opts li{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid #eef2f0;cursor:pointer;font:500 16px/22px "NaN SuperX",sans-serif}
.st-opts li:last-child{border-bottom:0}
.st-opts li small{display:block;font:400 12.5px/18px "NaN SuperX",sans-serif;color:#62625c}
.st-opts li .rd{margin-right:auto;width:24px;height:24px;border-radius:50%;border:2px solid #c9d1cd;flex:none;display:flex;align-items:center;justify-content:center}
.st-opts li.on .rd{border-color:#111;background:#111;color:#00ffa8;font-size:14px}
.st-opts li .lic{width:40px;height:40px;border-radius:50%;background:#f0f8f3;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.st-sec{margin:4px 0 8px;font:700 15px/22px "Expo Arabic",sans-serif;text-align:right}
.st-seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.st-seg button{height:40px;padding:0 16px;border-radius:20px;border:0;background:#f0f8f3;font:500 14px "NaN SuperX",sans-serif;color:#111;cursor:pointer;display:flex;align-items:center;gap:6px}
.st-seg button.on{background:#111;color:#fff;font-weight:600}
.st-seg button i.dot{width:8px;height:8px;border-radius:50%}
.st-seg-note{font:400 12.5px/18px "NaN SuperX",sans-serif;color:#62625c;margin:-10px 0 16px;text-align:right}
.st-tgl{display:flex;align-items:center;justify-content:space-between;height:52px;margin-bottom:12px;cursor:pointer;font:500 15px "NaN SuperX",sans-serif}
.st-tgl .st-switch{position:relative;left:auto;top:auto;flex:none}
.st-mhead{display:flex;align-items:center;gap:12px;margin:0 0 16px;text-align:right}
.st-mhead .ph{width:56px;height:56px;border-radius:16px;background-size:cover;background-position:center;flex:none}
.st-mhead b{display:block;font:700 18px/26px "Expo Arabic",sans-serif}
.st-mhead span{display:flex;align-items:center;gap:4px;font:400 13px/18px "NaN SuperX",sans-serif;color:#62625c}
.st-vals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.st-vals button{height:76px;border-radius:18px;border:1.5px solid #e3e9e6;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#111}
.st-vals button b{display:flex;align-items:center;gap:4px;font:700 20px/26px "NaN SuperX",sans-serif;direction:rtl}
.st-vals button b .riyal{width:13px;height:14px}
.st-vals button span{font:500 12px/16px "NaN SuperX",sans-serif;color:#62625c}
.st-vals button.on{border-color:#111;box-shadow:inset 0 0 0 1px #111;background:#f6f2ff}
.st-vals button.no span{color:#c0392b}
.st-who{display:flex;gap:8px;margin:-4px 0 16px;flex-wrap:wrap}
.st-who button{height:36px;padding:0 14px;border-radius:18px;border:1.5px solid #e3e9e6;background:#fff;font:500 13px "NaN SuperX",sans-serif;cursor:pointer}
.st-who button.on{border-color:#111;background:#111;color:#fff}
.st-code{display:flex;align-items:center;justify-content:space-between;gap:10px;height:56px;padding:0 8px 0 16px;border-radius:16px;background:#f6f2ff;border:1.5px dashed #bb8fff;margin:0 0 16px;
  font:700 18px "NaN SuperX",monospace;letter-spacing:.08em;direction:ltr}
.st-steps{list-style:none;margin:0 0 18px;padding:0;counter-reset:s}
.st-steps li{display:flex;gap:12px;align-items:flex-start;text-align:right;margin-bottom:14px}
.st-steps li::before{counter-increment:s;content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:#d4f8fd;color:#111;font:700 14px/32px "NaN SuperX",sans-serif;text-align:center}
.st-steps b{display:block;font:700 15px/22px "Expo Arabic",sans-serif}
.st-steps div>span{display:block;font:400 13px/19px "NaN SuperX",sans-serif;color:#62625c}
.e-btn.dim{background:#E3E8E5;color:#5d6460}
/* collection pages */
.st-cpage .hbody{padding-bottom:40px}
.st-chero{margin:0 16px 12px;height:150px;border-radius:24px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.st-chero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,17,17,0) 40%,rgba(17,17,17,.6))}
.st-chero div{position:absolute;right:16px;bottom:14px;z-index:1;color:#fff;text-align:right}
.st-chero b{display:block;font:700 22px/30px "Expo Arabic",sans-serif}
.st-chero span{font:400 13px "NaN SuperX",sans-serif;opacity:.9}
.st-cgrid{display:grid;grid-template-columns:repeat(2,160px);gap:16px 22px;justify-content:center;padding:8px 0 24px}
.st-cgrid button{width:160px;height:172px;background-size:100% 100%;border:0;cursor:pointer}

/* Home map card (map.js) */
.hm{position:absolute;left:16px;width:358px;height:230px;border-radius:24px;overflow:hidden;background:#121716;z-index:4;pointer-events:none;
  direction:ltr;font-family:"NaN SuperX","Expo Arabic",sans-serif;isolation:isolate;transform:translateZ(0)}
.hm i{display:block;font-style:normal}
.hm .art{position:absolute;left:0;top:-19px;width:358px;height:268px}
.hm .art svg{display:block}
.hm .mos{position:absolute;left:200px;top:131px;opacity:.3}
.hm .road{position:absolute;left:250px;top:83px;margin:0;font:500 12px/16px "NaN SuperX","Expo Arabic",sans-serif;color:#9aa3a0;white-space:nowrap}
/* radar: centre of "my location" */
.hm .radar{position:absolute;left:186px;top:109px;width:0;height:0}
.hm .radar>i{position:absolute;border-radius:50%}
.hm .glow{left:-90px;top:-70px;width:180px;height:140px;background:rgba(var(--acc-rgb),.14);filter:blur(25px);animation:hmGlow 6s ease-in-out infinite}
.hm .sweep{left:-98px;top:-98px;width:196px;height:196px;
  background:conic-gradient(from 0deg,rgba(var(--acc-rgb),0) 0deg,rgba(var(--acc-rgb),0) 250deg,rgba(var(--acc-rgb),.07) 320deg,rgba(var(--acc-rgb),.22) 358deg,rgba(var(--acc-rgb),0) 360deg);

const HM_ART = '<svg width="358" height="268" viewBox="0 0 358 268" fill="none" xmlns="http://www.w3.org/2000/svg"> <g> <path d="M358 0H0V268H358V0Z" fill="#121716"/> <g> <path d="M-10 40L368 22" stroke-width="5" stroke-linecap="round" stroke="#1D2524"/> <path d="M-10 150L368 132" stroke-width="5" stroke-linecap="round" stroke="#1D2524"/> <path d="M-10 206L368 190" stroke-width="5" stroke-linecap="round" stroke="#1D2524"/> <path d="M-10 262L368 246" stroke-width="5" stroke-linecap="round" stroke="#1D2524"/> <path d="M40 -10L56 278" stroke-width="5" stroke-linecap="round" stroke="#1D2524"/> <path d="M104 -10L118 278" stroke-width="5" stroke-linecap="round" stroke="#1D2524"/> <path d="M250 -10L264 278" stroke-width="5" stroke-linecap="round" stroke="#1D2524"/> <path d="M318 -10L332 278" stroke-width="5" stroke-linecap="round" stroke="#1D2524"/> </g> <path d="M202 153L250 151L253 189L205 191L202 153Z" fill="#0B3A31" stroke-width="8" stroke-linejoin="round" stroke="#0B3A31"/> <path d="M-10 99L368 77" stroke-width="20" stroke-linecap="round" stroke="#28322F"/> <path d="M176 -10L192 278" stroke-width="11" stroke-linecap="round" stroke="#28322F"/> <path d="M-10 99L-6.5 98.7963M368 77L364.5 77.2037M0.5 98.3889L7.5 97.9815M14.5 97.5741L21.5 97.1667M28.5 96.7593L35.5 96.3519M42.5 95.9444L49.5 95.537M56.5 95.1296L63.5 94.7222M70.5 94.3148L77.5 93.9074M84.5 93.5L91.5 93.0926M98.5 92.6852L105.5 92.2778M112.5 91.8704L119.5 91.463M126.5 91.0556L133.5 90.6481M140.5 90.2407L147.5 89.8333M154.5 89.4259L161.5 89.0185M168.5 88.6111L175.5 88.2037M182.5 87.7963L189.5 87.3889M196.5 86.9815L203.5 86.5741M210.5 86.1667L217.5 85.7593M224.5 85.3519L231.5 84.9444M238.5 84.537L245.5 84.1296M252.5 83.7222L259.5 83.3148M266.5 82.9074L273.5 82.5M280.5 82.0926L287.5 81.6852M294.5 81.2778L301.5 80.8704M308.5 80.463L315.5 80.0556M322.5 79.6482L329.5 79.2407M336.5 78.8333L343.5 78.4259M350.5 78.0185L357.5 77.6111" stroke="#121716"/> </g> </svg>';
const HM_ARC = 'M4.12132 3.16085C2.67187 3.12592 1.22243 2.60202 0 1.64154L1.22243 0.0698519C2.1829 0.820771 3.31802 1.20496 4.43567 1.17003C5.466 1.13511 6.35661 0.733456 6.91544 0L8.48713 1.22243C7.54411 2.42739 6.12959 3.10846 4.48804 3.16085C4.3658 3.17831 4.24356 3.17831 4.12132 3.16085Z';

const HM_MAPICON = c => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.66667" stroke-linecap="round" stroke-linejoin="round"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>`;

const HM_PINS = [
  {k: 'radisson', v: '25%', d: '0.8', top: 43, right: 358 - 295, r: 8, logo: {w: 64, h: 26, r: 8, b: 1}},
  {k: 'br', v: '2+1', d: '1.1', top: 114, right: 358 - 294.5, r: 8, logo: {w: 28.5, h: 24, r: 6, b: .375}},
  {k: 'thirty', v: '1+1', d: '1.4', top: 126, left: 65, r: 8, logo: {w: 24, h: 24, r: 6, b: .375}},
  {k: 'alma', v: '15%', d: '1.8', top: 68, left: 25, r: 8, logo: {w: 24, h: 24, r: 6, b: .375}},   // was Bassami's round pin; Tawaty asked for Alma's logo and the usual radius (22 Nov)
  {k: 'chuck', v: '20%', d: '1.3', top: 12, left: 92, r: 8, logo: {w: 24, h: 24, r: 6, b: .375}},
];
const HM_THEME = {wala: ['#00FFA8', '0,255,168', '#111'], aramco: ['#47A1C1', '71,161,193', '#000']};

function makeHomeMap(m, ctx, dy) {
  const [acc, rgb, ink] = HM_THEME[m.theme] || HM_THEME.wala;
  const el = document.createElement('div'); el.className = 'hm';
  el.style.top = (m.y - dy) + 'px';
  el.style.setProperty('--acc', acc); el.style.setProperty('--acc-rgb', rgb); el.style.setProperty('--acc-ink', ink);
  let mos = '';
  for (let j = 0; j < 3; j++) for (let i = 0; i < 5; i++) mos += `<path transform="translate(${3.76 + 12 * i} ${10.41 + 16 * j})" d="${HM_ARC}"/>`;
  // logo tiles: each Figma tile (with its border), cut from the Home export with rounded transparent corners (map_src)
  const logo = (k, L) => `<i class="lg" style="width:${L.w}px;height:${L.h}px;background-image:url(${IMG('mp_' + k)})"></i>`;
  const pins = HM_PINS.map((p, i) => {
    const pos = p.left != null ? `left:${p.left}px;transform-origin:left center;` : `right:${p.right}px;transform-origin:right center;`;
    return `<div class="mp" data-i="${i}" style="top:${p.top}px;${pos}border-radius:${p.r}px"><p dir="rtl"><span>${p.v}</span><span class="d"> · ${p.d} كم</span></p>${logo(p.k, p.logo)}</div>`;
  }).join('');
  el.innerHTML = `<div class="art">${HM_ART}</div>` +
    `<svg class="mos" width="56" height="42" viewBox="0 0 56 42" fill="${acc}">${mos}</svg>` +
    `<p class="road" dir="rtl">طريق الملك فهد</p>` +
    `<div class="radar"><i class="glow"></i><i class="sweep"></i><i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="halo"></i><i class="me"></i></div>` +
    pins +
    `<div class="cluster">+12</div><div class="locate">${HM_LOCATE}</div>` +
    `<div class="bar"><div class="btn">${HM_MAPICON(ink)}<span>افتح الخريطة</span></div><div class="sum"><b dir="rtl">18 متجرا و32 عرضا</b><span dir="rtl">ضمن 2 كم منك</span></div></div>`;
  const all = [...el.querySelectorAll('.mp')];
  let on = 0;
  const show = i => all.forEach((p, j) => p.classList.toggle('on', j === i));
  show(0);
  const t = setInterval(() => {
    if (!el.isConnected) return clearInterval(t);
    const top = top_();
    if (document.hidden || !top || top.el !== el.closest('.layer')) return;
    on = (on + 1) % all.length; show(on);
  }, 2600);
  return el;
}

/* category rows: each row slides slowly in an endless loop (two copies of the row, one period apart).
   Drag or swipe a row left or right to move it yourself; a flick sets the direction the loop carries on in,
   and the row eases back to the slow speed. A touch without a drag holds the row still. */
const MQ_SPEED = 22;   // px per second, the slow loop
const MQ_EASE = 2.2;   // how fast a flick settles back to the slow speed (per second)
function makeMarquee(r, ctx, dy) {
  const box = document.createElement('div'); box.className = 'rail mq';
  const [ct, cb] = (MAN.edge && MAN.edge[r.img]) || ['#f0f8f3', '#f0f8f3'];
  const light = c => Math.min(...[1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16))) > 200;
  const et = light(ct) ? 2 : 0, eb = light(cb) ? 2 : 0;
  Object.assign(box.style, {top: (r.y - dy - et) + 'px', height: (r.h + et + eb) + 'px', background: `linear-gradient(${ct} 0 50%, ${cb} 50% 100%)`});
  const rows = {};
  r.cards.forEach(c => (rows[c[1]] = rows[c[1]] || []).push(c));
  const ys = Object.keys(rows).map(Number).sort((a, b) => a - b);
  const W = 390 - r.minX;
  const lanes = [];
  ys.forEach((y, i) => {
    const cs = rows[y].sort((a, b) => a[0] - b[0]);
    const h = cs[0][3], x0 = cs[0][0], x1 = Math.max(...cs.map(c => c[0] + c[2]));
    const gap = cs.length > 1 ? cs[1][0] - (cs[0][0] + cs[0][2]) : 8;
    const period = x1 - x0 + gap;
    const b0 = i === 0 ? 0 : (ys[i - 1] + rows[ys[i - 1]][0][3] + y) / 2;
    const b1 = i === ys.length - 1 ? r.h : (y + h + ys[i + 1]) / 2;
    const track = document.createElement('div'); track.className = 'mq-track';
    Object.assign(track.style, {left: x0 + 'px', top: (et + b0) + 'px', height: (b1 - b0) + 'px'});
    for (const off of [0, -period]) {
      const copy = document.createElement('div'); copy.className = 'mq-copy';
      Object.assign(copy.style, {left: off + 'px', width: period + 'px', height: (b1 - b0) + 'px',
        backgroundImage: `url(${IMG(r.img)})`, backgroundSize: `${W}px ${r.h}px`, backgroundPosition: `${-(x0 - r.minX)}px ${-b0}px`});
      cs.forEach(c => makeHot(copy, [c[0] - x0, c[1] - b0, c[2], c[3], c[4]], ctx));
      track.appendChild(copy);
    }
    box.appendChild(track);
    lanes.push({track, period, top: et + b0, bot: et + b1, o: 0, v: MQ_SPEED, dir: 1, held: false});
  });
  const paint = L => { const t = ((L.o % L.period) + L.period) % L.period; L.track.style.transform = `translateX(${t}px)`; };

  /* the loop runs only while this screen is on top */
  let last = 0, raf = 0, idle = 0;
  const live = () => { const t = top_(); return t && t.el && t.el === box.closest('.layer'); };
  const tick = now => {
    raf = 0;
    if (!box.isConnected) return;
    if (!live()) { last = 0; idle = setTimeout(wake, 400); return; }
    const dt = last ? Math.min(.05, (now - last) / 1000) : 0; last = now;
    for (const L of lanes) {
      if (L.held) continue;
      const goal = L.dir * MQ_SPEED;
      L.v = goal + (L.v - goal) * Math.exp(-MQ_EASE * dt);
      L.o += L.v * dt; paint(L);
    }
    raf = requestAnimationFrame(tick);
  };
  const wake = () => { clearTimeout(idle); if (!raf) raf = requestAnimationFrame(tick); };
  wake();

  /* drag: one pointer at a time, on the row under it */
  let g = null, seq = 0;
  const laneAt = ev => {
    const b = box.getBoundingClientRect(), y = (ev.clientY - b.top) / scale;
    return lanes.find(L => y >= L.top && y < L.bot) || lanes[y < lanes[0].top ? 0 : lanes.length - 1];
  };
  box.addEventListener('pointerdown', ev => {
    if (g || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
    ev.stopPropagation();   // keep the screen's own mouse drag-scroll out of it
    const L = laneAt(ev);
    g = {id: ev.pointerId, L, sx: ev.clientX, sy: ev.clientY, o0: L.o, axis: '', hist: [[performance.now(), L.o]],
         sc: ctx.scroll ? ctx.scroll.scrollTop : 0, mouse: ev.pointerType === 'mouse'};
    L.held = true; L.v = 0; dragMoved = false; seq++;
  });
  const move = ev => {
    if (!g || ev.pointerId !== g.id) return;
    const dx = (ev.clientX - g.sx) / scale, dyy = (ev.clientY - g.sy) / scale;
    if (!g.axis) {
      if (Math.hypot(dx, dyy) < 6) return;
      g.axis = Math.abs(dx) >= Math.abs(dyy) ? 'x' : 'y';
      dragMoved = true;
      if (g.axis === 'x') { document.body.classList.add('dragging'); try { box.setPointerCapture(ev.pointerId); } catch (e) {} }
      else if (!g.mouse) { end(ev); return; }   // touch: the page scrolls itself (pan-y)
    }
    if (g.axis === 'y') { if (ctx.scroll) ctx.scroll.scrollTop = g.sc - dyy; return; }
    g.L.o = g.o0 + dx; paint(g.L);
    const now = performance.now();
    g.hist.push([now, g.L.o]); while (g.hist.length > 2 && now - g.hist[0][0] > 120) g.hist.shift();
  };
  const end = ev => {
    if (!g || ev.pointerId !== g.id) return;
    const {L, hist, axis, o0} = g; g = null;
    document.body.classList.remove('dragging');
    L.held = false;
    if (axis === 'x') {
      const now = performance.now(), [ta, oa] = hist[0], [tb, ob] = hist[hist.length - 1];
      const v = (tb - ta) > 8 && now - tb < 100 ? Math.max(-1600, Math.min(1600, (ob - oa) / ((tb - ta) / 1000))) : 0;
      L.v = v;
      if (Math.abs(v) > 40) L.dir = Math.sign(v);             // a flick sets the direction
      else if (Math.abs(L.o - o0) > 24) L.dir = Math.sign(L.o - o0);   // so does a slow drag
    }
    const n = seq; setTimeout(() => { if (n === seq) dragMoved = false; }, 0);   // a quick re-grab keeps its own flag
    wake();
  };
  window.addEventListener('pointermove', move);
  ['pointerup', 'pointercancel'].forEach(e => window.addEventListener(e, end));
  box.addEventListener('lostpointercapture', end);
  return box;
}

/* Afiya cover (merchant C1): Tawaty's five photos play like stories, 3 s each, with the progress bars filling right to left.

/* banner carousels turn on their own every 4 s; a touch pauses them for a while */
function autoCarousel(box, n, step, onIdx, ms = 4000) {
  let hold = 0;
  const idx = () => Math.min(n - 1, Math.round(Math.abs(box.scrollLeft) / step));
  const pause = () => { hold = Date.now() + 7000; };
  ['pointerdown', 'touchstart', 'wheel'].forEach(t => box.addEventListener(t, pause, {passive: true}));
  if (onIdx) box.addEventListener('scroll', () => onIdx(idx()), {passive: true});
  const t = setInterval(() => {
    if (!box.isConnected) return clearInterval(t);
    const top = top_();
    if (Date.now() < hold || document.hidden || !top || top.el !== box.closest('.layer')) return;
    box.scrollTo({left: -((idx() + 1) % n) * step, behavior: 'smooth'});
  }, ms);
}
function homeCarousel(box, r, p, dy) {
  const n = r.cards.length, step = r.cards[1][0] - r.cards[0][0];

  d.innerHTML = '<i class="on"></i>' + '<i></i>'.repeat(n - 1);
  p.appendChild(d);
  const dots = d.querySelectorAll('i');
  autoCarousel(box, n, step, i => dots.forEach((x, j) => x.classList.toggle('on', j === i)));
}

function makeSticker(o) {
  const el = document.createElement('div'); el.className = 'sk';

  const LIFT = o.lift || SK_LIFT;
  el.innerHTML = `<div class="sk-under" style="left:${i}px;top:${i}px;width:${W}px;height:${H}px;border-radius:${r}px">` +
      `<b style="right:${R - o.codeRight}px;top:${o.codeTop - i}px">WAL<span>A15</span></b></div>` +
    `<i class="sk-shade" style="left:${i}px;top:${i}px;width:${W}px;height:${H}px"></i>` +
    `<div class="sk-cover" style="left:${i}px;top:${i}px;width:${W}px;height:${H}px;border-radius:${r}px">` +
      `<i style="left:${o.lx - i}px;top:${o.ly - i}px;width:${o.lw}px;height:${o.lh}px;background-image:url(${IMG(o.label)})"></i></div>` +
    '<div class="sk-flapw"><i class="sk-flap"></i></div>';

  wake();

}

   HTML to the Figma front (565:2847). A sideways swipe either way sends the top card round to the back of the deck. */
const TP_CARDS = [
  {k: 'afiya', m: 'عافية', t: 'خصم ‎30% على جميع الوجبات الصحية', d: 'خصم ‎30%', ch: 'في الفروع', date: 'حتى 31 ديسمبر 2026'},
  {k: 'salon', m: 'صالون 30 درجة للحلاقة الرجالية', t: 'خصم ‎15% على الحلاقة والعناية باللحية', d: 'خصم ‎15%', ch: 'في الفروع', date: 'حتى 31 ديسمبر 2026'},
  {k: 'verve', m: 'فيرف سبا', t: 'خصم ‎30% على جلسات السبا', d: 'خصم ‎30%', ch: 'في الفروع', date: 'حتى 31 ديسمبر 2026', plate: '#e1cfb9'},
];
function tpCard(c, ctx, y) {

}
const TP_OUT = 280, TP_BACK = 300;   // ms: swing out, then tuck in behind
function makeDeck(p, s, ctx, y, dotsY) {
  const f = makeFlip(s, ctx, y);
  const items = [f, ...TP_CARDS.map(c => tpCard(c, ctx, y))];
  items.forEach(el => p.appendChild(el));
  items[0].classList.add('on'); f.style.touchAction = 'pan-y';
  const d = document.createElement('div'); d.className = 'cdots tpdots';
  Object.assign(d.style, {top: (dotsY - 1) + 'px', height: '14px', background: MAN.bg[s.img + '_flip'] || '#f0f8f3'});   // baked dots: y 2713-2721
  d.innerHTML = items.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('');
  p.appendChild(d);
  const dots = [...d.children];
  let cur = 0, busy = false, g = null, seq = 0;
  const top = () => items[cur], nxt = () => items[(cur + 1) % items.length];
  const setNext = on => { items.forEach(el => el.classList.remove('next')); if (on) nxt().classList.add('next'); };
  const place = (el, dx) => { el.style.transform = dx ? `translateX(${dx}px) rotate(${dx * .035}deg)` : ''; };
  const settle = () => { const n = seq; setTimeout(() => { if (n === seq) dragMoved = false; }, 0); };
  function advance(dir) {
    busy = true;
    const out = top(), inn = nxt(), from = out.style.transform || 'none';
    setNext(true);
    inn.animate([{transform: 'translateY(10px) scale(.95)'}, {transform: 'none'}], {duration: TP_OUT + TP_BACK, easing: 'cubic-bezier(.2,.7,.2,1)'});
    const a = out.animate([{transform: from}, {transform: `translateX(${dir * 250}px) translateY(-6px) rotate(${dir * 10}deg)`}],
      {duration: TP_OUT, easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'forwards'});
    a.onfinish = () => {
      out.style.zIndex = 4;                              // now behind the new top card
      const b = out.animate([{transform: `translateX(${dir * 250}px) translateY(-6px) rotate(${dir * 10}deg)`}, {transform: 'translateY(14px) scale(.92)'}],
        {duration: TP_BACK, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards'});
      b.onfinish = () => {
        a.cancel(); b.cancel(); out.style.zIndex = ''; place(out, 0);
        out.classList.remove('on'); inn.classList.remove('next'); inn.classList.add('on');
        cur = (cur + 1) % items.length; dots.forEach((x, j) => x.classList.toggle('on', j === cur));
        busy = false;
      };
    };
  }
  const down = ev => {
    const el = ev.currentTarget;
    if (busy || g || el !== top() || f.classList.contains('flipped') || f.classList.contains('busy') || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
    if (ev.pointerType === 'mouse') ev.stopPropagation();   // keep the page's mouse drag-scroll out of it
    g = {el, id: ev.pointerId, sx: ev.clientX, sy: ev.clientY, axis: '', dx: 0, t: performance.now(), sc: ctx.scroll ? ctx.scroll.scrollTop : 0, mouse: ev.pointerType === 'mouse'};
    seq++;
  };
  const move = ev => {
    if (!g || ev.pointerId !== g.id) return;
    const dx = (ev.clientX - g.sx) / scale, dy = (ev.clientY - g.sy) / scale;
    if (!g.axis) {
      if (Math.hypot(dx, dy) < 6) return;
      g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      dragMoved = true;
      if (g.axis === 'x') { try { g.el.setPointerCapture(ev.pointerId); } catch (e) {} setNext(true); g.el.style.transition = 'none'; }
      else if (!g.mouse) { g = null; settle(); return; }
    }
    if (g.axis === 'y') { if (ctx.scroll) ctx.scroll.scrollTop = g.sc - dy; return; }
    g.dx = dx; place(g.el, dx);
  };
  const up = ev => {
    if (!g || ev.pointerId !== g.id) return;
    const {el, axis, dx, t} = g; g = null; settle();
    if (axis !== 'x') return;
    const v = Math.abs(dx) / Math.max(1, performance.now() - t);
    if (Math.abs(dx) > 70 || (Math.abs(dx) > 24 && v > .45)) return advance(dx > 0 ? 1 : -1);

    setTimeout(() => { el.style.transition = ''; if (!busy) setNext(false); }, 260);
  };
  items.forEach(el => {
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);

}

/* ---------- stack operations ---------- */
function mount(entry, anim) {
  const el = build(entry);
  entry.el = el;
  if (anim && anim !== 'none' && !entry.enter) entry.enter = anim;
  phone.insertBefore(el, $('#toast'));
  if (entry.ctx.s.sheet) {
    if (anim === 'none') el.classList.add('in');
    else requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  } else if (anim && anim !== 'none') {
    el.classList.add(anim);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove(anim)));
  }
  onShow(entry);
  return el;
}
function unmount(entry, anim) {
  const el = entry.el; if (!el) return;
  clearTimeout(entry.timer); clearInterval(entry.ctx && entry.ctx.clockT);
  if (anim === 'none') { el.remove(); return; }
  if (entry.ctx.s.sheet) el.classList.remove('in');
  else el.classList.add(anim || 'from-left');
  setTimeout(() => el.remove(), dur);
}
function push(e, anim = 'from-left') {
  const top = stack[stack.length - 1];
  stack.push(e); mount(e, anim); update();
}
function pop(n = 1, anim) {
  for (let i = 0; i < n && stack.length > 1; i++) {
    const e = stack.pop(); unmount(e, i === n - 1 ? (anim || (e.ctx.s.sheet ? null : e.enter || 'from-left')) : 'none');
  }
  update();
}
function replaceTop(e, anim = 'fade') {
  const old = stack.pop(); stack.push(e);
  mount(e, anim);
  setTimeout(() => unmount(old, 'none'), anim === 'none' ? 0 : dur);
  update();
}
function resetTo(entries) {
  stack.forEach(e => unmount(e, 'none'));
  stack = entries; stack.forEach(e => mount(e, 'none')); update();
}
function rerenderAll() {
  const keep = stack.map(e => e.ctx && e.ctx.scroll ? e.ctx.scroll.scrollTop : 0);
  stack.forEach(e => unmount(e, 'none'));
  stack.forEach((e, i) => { mount(e, 'none'); if (e.ctx.scroll && resolve(e) === e.id) e.ctx.scroll.scrollTop = keep[i]; });
  update();
}
const top_ = () => stack[stack.length - 1];

function onShow(e) {
  const s = e.ctx.s;
  if (s.scanner) e.timer = setTimeout(() => { if (top_() === e) act_('scanned', e.ctx); }, 2600);
  if (e.scrollTo) setTimeout(() => e.ctx.scroll.scrollTo({top: e.scrollTo, behavior: 'smooth'}), 420);
}

function update() {
  const names = stack.map(e => e.label || (SCR[e.id] ? SCR[e.id].label : e.id));
  $('#crumb').textContent = names.join('  ›  ');
  stack.forEach((e, i) => e.el && (e.el.style.pointerEvents = i === stack.length - 1 ? '' : 'none'));
  if (window.onStack) onStack();
}

/* ---------- actions ---------- */
function act_(act, ctx, hsEl) {
  if (hsEl && hsEl.dataset.act !== act) act = hsEl.dataset.act;
  if (window.edgeAct && edgeAct(act, ctx, hsEl)) return;
  const [a, arg] = act.split(/:(.*)/s);
  const e = ctx.entry;
  switch (a) {
    case 'toast': return toast(arg);
    case 'fav': return toast('fav');
    case 'back':
      if (arg) toast(arg);
      if (stack.length > 1) pop(); else if (resolve(stack[0]) !== resolve({t: 'home'})) resetTo([{t: 'home'}]);
      return;
    case 'push': return push({t: arg});
    case 'tab':
      if (arg === 'home') return resetTo([{t: 'home'}]);
      if (arg === 'stores' || arg === 'near') return resetTo([{t: 'home'}, {t: 'stores', lens: 's1', root: 1}]);
      if (arg === 'wallet') return resetTo([{t: 'home'}, {t: 'h1'}]);
      return;
    case 'cats':   // a Home category chip opens Stores already drilled into that category
      return resetTo([{t: 'home'}, {t: 'stores', lens: 's1', root: 1, cat: arg}]);
    case 'stores': {
      if (e.t === 'stores') { e.lens = arg; return replaceTop({t: 'stores', lens: arg}, 'none'); }
      return push({t: 'stores', lens: arg});
    }
    case 'locOn': cfg.loc = true; $('#c-loc').checked = true; saveCfg(); return replaceTop({t: 'stores', lens: 's1'}, 'fade');
    case 'merchant': return openMerchant(arg === 'v' ? 1250 : 0);
    case 'cashStore': return push({t: 'merchant', v: 'c2'});   // the cashback card opens the cashback-only store screen
    case 'scrollTo': return ctx.scroll.scrollTo({top: +arg, behavior: 'smooth'});
    case 'offer': return push({t: 'offer', mode: 'tall', flow: 1});
    case 'expand': return replaceTop({t: 'offer', mode: cfg.offer === 'o2b' && e.revealed ? 'full' : 'full', flow: e.flow, revealed: e.revealed}, 'from-sheet');
    case 'collapse': return replaceTop({t: 'offer', mode: e.revealed && cfg.offer === 'o2b' ? 'after' : 'tall', flow: e.flow, revealed: e.revealed}, 'fade');
    case 'mode': {
      const anim = e.ctx.s.sheet ? 'from-sheet' : 'none';
      const n = {t: 'offer', mode: arg, flow: e.flow, revealed: e.revealed};
      replaceTop(n, anim);
      if (anim === 'none') n.ctx.scroll.scrollTop = ctx.scroll.scrollTop;
      return;
    }
    case 'scan': return push({t: 'r1', scanStart: 1});
    case 'scanTab': return push({t: 'r1', scanStart: 1, tabScan: 1}, 'from-bottom');
    case 'readyToUse': return push({t: 'r2', scanStart: 1}, 'from-bottom');
    case 'scanned': {
      if (top_() !== e) return;
      clearTimeout(e.timer);
      const next = e.tabScan ? 'r0' : cfg.result;
      return replaceTop({t: next, scanStart: 1, tabScan: e.tabScan}, 'fade');
    }
    case 'swap': return replaceTop({t: arg, scanStart: 1, tabScan: e.tabScan}, 'fade');
    case 'pick': if (ctx.ring) ctx.ring.style.top = hsEl.style.top; return;
    case 'finish': case 'finishTo': {
      let i = stack.length - 1;
      while (i > 0 && !stack[i].scanStart) i--;
      while (i > 0 && stack[i - 1].scanStart) i--;
      const n = stack.length - i;
      pop(n, 'from-bottom');
      if (arg === 'merchant') setTimeout(() => openMerchant(0), 60);
      return;
    }
    case 'reveal': {
      e.revealed = true;
      showRevealed(ctx, true);
      setTimeout(() => push({t: 'o2b_success', enter: 'fade', revealOf: e}, 'fade'), 950);
      return;
    }
    case 'revealDone': {
      if (arg) toast(arg);
      pop(1, 'fade');
      const p = top_();
      if (p.t === 'offer' && p.id === 'o2b_tall') replaceTop({t: 'offer', mode: 'after', flow: p.flow, revealed: true}, 'none');
      return;
    }
    case 'tpOffer': {   // the HTML Today's pick cards are branch offers: open the in-store offer sheet
      if (cfg.offer !== 'o2a') { cfg.offer = 'o2a'; saveCfg(); seg('c-offer', 'offer'); }
      return push({t: 'offer', mode: 'tall', flow: 1});
    }
    case 'flip': {
      const f = ctx.flip; f.classList.add('busy'); f.classList.toggle('flipped');
      clearTimeout(f._t); f._t = setTimeout(() => f.classList.remove('busy'), 650);
      return;
    }
    case 'tpReveal': {
      stackTpRevealed = true;
      addTpCode(ctx.tpBack, true);
      setTimeout(() => push({t: 'tp_success', enter: 'fade'}, 'fade'), 950);
      return;
    }
    case 'bal': {
      const on = !ctx.bal.classList.contains('on');
      ctx.bal.classList.toggle('on', on); ctx.spacer.style.height = on ? '152px' : '0';
      return;
    }
  }
}

function openMerchant(scrollTo) {
  // if a merchant page sits right under the current offer sheet, go back to it
  const t = top_();
  const below = stack[stack.length - 2];
  if (t.t === 'offer' && below && below.t === 'merchant') { pop(); if (scrollTo) below.ctx.scroll.scrollTo({top: scrollTo, behavior: 'smooth'}); return; }
  if (t.t === 'offer') { replaceTop({t: 'merchant', scrollTo: cfg.merchant === 'c1a' ? scrollTo : 0}, 'from-left'); return; }
  push({t: 'merchant', scrollTo: cfg.merchant === 'c1a' ? scrollTo : 0});
}

/* ---------- clock ---------- */
function tickClock(c) {
  const f = () => {
    const d = new Date(); let h = d.getHours(); const am = h < 12; h = h % 12 || 12;
    const p = n => String(n).padStart(2, '0');
    c.textContent = `${h}:${p(d.getMinutes())}:${p(d.getSeconds())} ${am ? 'ص' : 'م'}`;
  };
  f(); const t = setInterval(() => { if (!c.isConnected) return clearInterval(t); f(); }, 1000);

/* ---------- gestures ---------- */
let dragMoved = false;
function dragScroll(el, axis) {
  let sx, sy, sl, st, down = false;
  el.addEventListener('pointerdown', ev => {
    if (ev.pointerType !== 'mouse' || ev.button !== 0) return;
    down = true; dragMoved = false; sx = ev.clientX; sy = ev.clientY; sl = el.scrollLeft; st = el.scrollTop;
    ev.stopPropagation();
  });
  window.addEventListener('pointermove', ev => {
    if (!down) return;
    const k = scale;
    const dx = (ev.clientX - sx) / k, dy = (ev.clientY - sy) / k;
    if (!dragMoved && Math.hypot(dx, dy) > 6) { dragMoved = true; document.body.classList.add('dragging'); if (axis === 'x') el.style.scrollSnapType = 'none'; }
    if (dragMoved) { if (axis === 'x') el.scrollLeft = sl - dx; else el.scrollTop = st - dy; }
  });
  window.addEventListener('pointerup', () => {
    if (!down) return; down = false; document.body.classList.remove('dragging');

    setTimeout(() => dragMoved = false, 0);

}
function sheetGestures(p, ctx) {
  let y0 = null;
  p.addEventListener('wheel', ev => { ev.preventDefault(); if (top_() !== ctx.entry) return; if (ev.deltaY > 12) act_('expand', ctx); else if (ev.deltaY < -24) act_('back', ctx); }, {passive: false});
  p.addEventListener('touchstart', ev => { y0 = ev.touches[0].clientY; }, {passive: true});
  p.addEventListener('touchend', ev => {
    if (y0 == null || top_() !== ctx.entry) return; const d = ev.changedTouches[0].clientY - y0; y0 = null;
    if (d < -40) act_('expand', ctx); else if (d > 60) act_('back', ctx);
  });
}

/* ---------- fit the phone ---------- */
let scale = 1;
const FULL = () => matchMedia('(max-width: 600px)').matches && !/[?&]frame\b/.test(location.search);
function fit() {
  const wrap = $('#wrap');
  if (FULL()) {

    document.body.classList.add('full');
    scale = innerWidth / 390;
    phone.style.height = Math.ceil(innerHeight / scale) + 'px';
    phone.style.transform = `scale(${scale})`;
    wrap.style.width = innerWidth + 'px'; wrap.style.height = innerHeight + 'px';

  }
  document.body.classList.remove('full', 'ctl-open');
  phone.style.height = '';

  const availH = narrow ? Infinity : window.innerHeight - 90;
  const availW = narrow ? window.innerWidth - 56 : 430;
  scale = Math.min(1, availH / 844, availW / 390);

function setSim(k, v, quiet) {
  sim[k] = v; saveSim();
  if (k === 'loc') { cfg.loc = v === 'on'; saveCfg(); const c = $('#c-loc'); if (c) c.checked = cfg.loc; }
  if (k === 'net' && v === 'slow') stack.forEach(e => { e.loaded = false; });
  if (k === 'offer') { pendingLast = false; reminded = false; stack.forEach(e => { e.lastOk = false; }); }

/* ---------- small helpers ---------- */
const colAt = (img, y) => {
  const c = MAN.col && MAN.col[img];
  if (!c) return MAN.bg[img] || '#EEF6F2';
  return c[Math.max(0, Math.min(c.length - 1, Math.round(y / 8)))];
};
function hostAt(ctx, y) {
  const s = ctx.s;
  if (s.sheet) return [ctx.canvas, 96];
  if (s.split) return y >= s.split ? [ctx.segB, s.split] : [ctx.segA, 0];
  return [ctx.canvas, 0];
}
function place(ctx, r, html, cls = '', st = {}) {
  const [x, y, w, h] = r;
  const [p, dy] = hostAt(ctx, y);
  const d = document.createElement('div');
  d.className = ('ov ' + cls).trim();
  Object.assign(d.style, {left: x + 'px', top: (y - dy) + 'px', width: w + 'px'}, h != null ? {height: h + 'px'} : {}, st);
  if (html != null) d.innerHTML = html;
  p.appendChild(d);
  return d;
}
function shake(el) { if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
const btnHtml = (label, icon, cls = '', attrs = '') => `<button class="e-btn ${cls}" ${attrs}><span>${label}</span>${icon ? ic(icon) : ''}</button>`;
const cardHtml = o => `<i class="e-mini tone-${o.tone}">${ic(o.icon)}</i><div class="tx"><b>${o.t}</b><span>${o.b}</span></div>` +
  (o.btn ? `<button class="ov-pill" data-a="${o.a}">${o.btn}</button>` : '');

function rebuildTop() {
  const t = top_(); if (!t) return;
  const st = t.ctx && t.ctx.scroll ? t.ctx.scroll.scrollTop : 0;
  unmount(t, 'none'); mount(t, 'none');

}
