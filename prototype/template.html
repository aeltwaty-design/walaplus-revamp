<title>WalaPlus Final UI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
@font-face{font-family:"Expo Arabic";src:url(fonts/expo-medium.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"Expo Arabic";src:url(fonts/expo-bold.otf) format("opentype");font-weight:700;font-display:swap}
@font-face{font-family:"NaN SuperX";src:url(fonts/nan-regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"NaN SuperX";src:url(fonts/nan-medium.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"NaN SuperX";src:url(fonts/nan-semibold.ttf) format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:"NaN SuperX";src:url(fonts/nan-bold.ttf) format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Noto Emoji";src:url(fonts/noto-emoji.woff2) format("woff2");font-weight:500;font-display:block}
:root{
  --bg:#eef3f0;--panel:#ffffff;--ink:#0d1714;--muted:#5d6b66;--line:#dbe4df;
  --chip:#f1f5f3;--chip-on:#0d1714;--chip-on-ink:#00ffa8;--accent:#00c785;--shadow:0 18px 50px rgba(10,40,30,.16);
  --body:"NaN SuperX","Expo Arabic",system-ui,sans-serif;--ar:"Expo Arabic","NaN SuperX",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1110;--panel:#141c1a;--ink:#e9f2ee;--muted:#93a39d;--line:#24302c;
  --chip:#1c2623;--chip-on:#00ffa8;--chip-on-ink:#06110d;--accent:#00ffa8;--shadow:0 18px 50px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  --bg:#0b1110;--panel:#141c1a;--ink:#e9f2ee;--muted:#93a39d;--line:#24302c;
  --chip:#1c2623;--chip-on:#00ffa8;--chip-on-ink:#06110d;--accent:#00ffa8;--shadow:0 18px 50px rgba(0,0,0,.5);}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));}
.app{display:flex;gap:28px;justify-content:center;align-items:flex-start;min-height:calc(100vh - 32px)}
.stage{flex:0 0 auto;position:sticky;top:16px}
.phone-wrap{position:relative}
/* the app is light only: the shell's dark mode (phone set to dark) must not reach text inside the phone (Tawaty, 22 Nov) */
.phone{color:#111;color-scheme:light}
.phone{position:relative;width:390px;height:844px;border-radius:0;overflow:hidden;background:#000;
  box-shadow:var(--shadow),0 0 0 10px #0b0f0e,0 0 0 11px #2a3330;transform-origin:top left;direction:rtl;
  font-family:var(--ar);-webkit-user-select:none;user-select:none}
.under{font-size:12px;color:var(--muted);text-align:center;margin-top:22px}
/* panel */
.panel{flex:0 1 340px;min-width:280px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 18px 14px;box-shadow:var(--shadow)}
.panel h1{font-size:17px;margin:0 0 2px;font-weight:700}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.45}
.grp{margin:0 0 14px}
.grp>label:not(.sw){display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 11px;cursor:pointer;line-height:1.1}
.seg button.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent;font-weight:700}
.seg button small{display:block;font-size:10.5px;opacity:.7;font-weight:400;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;margin:4px 0}
.sw input{accent-color:var(--accent);width:16px;height:16px}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
summary{cursor:pointer;font-weight:700;font-size:13px;margin-bottom:8px}
.idx{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;max-height:320px;overflow:auto}
.idx button{all:unset;cursor:pointer;font-size:12px;padding:4px 6px;border-radius:8px;color:var(--ink)}
.idx button:hover{background:var(--chip)}
.idx b{display:block;grid-column:1/-1;font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
.crumb{font-size:12px;color:var(--muted);margin:10px 0 0;min-height:16px}
@media (max-width:760px){.app{flex-direction:column;align-items:center}.stage{position:static}.panel{width:100%;flex-basis:auto}}

/* app layers */
.layer{position:absolute;inset:0;overflow:hidden;isolation:isolate;z-index:0}
.layer.page{background:#fff}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.canvas{position:relative;width:390px;background-repeat:no-repeat;background-size:390px auto}
.seg-a,.seg-b{position:relative;width:390px;background-repeat:no-repeat;background-size:390px auto}
.spacer{height:0;background-size:100% 100%;transition:height .32s cubic-bezier(.3,.7,.2,1)}
.hs{position:absolute;cursor:pointer;border-radius:12px;z-index:5}
.show-hs .hs,.hint .hs{outline:2px solid rgba(0,200,140,.85);background:rgba(0,255,168,.16)}
.hint .hs{animation:hint .7s ease}
@keyframes hint{0%,100%{opacity:0}30%,70%{opacity:1}}
.fixed{position:absolute;left:0;width:390px;background-repeat:no-repeat;background-size:100% auto;z-index:20}
.rail{position:absolute;left:0;width:390px;overflow-x:auto;overflow-y:hidden;direction:rtl;scrollbar-width:none;z-index:4;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail.snap{scroll-snap-type:x mandatory;scroll-padding-inline:16px}
.rail .inner{position:relative;direction:ltr;background-repeat:no-repeat;background-size:100% 100%}
.rail .inner .snap-pt{scroll-snap-align:start}
.rail.mq{overflow:hidden;width:390px;box-sizing:border-box;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.mq-track{position:absolute;width:0;will-change:transform}
.mq-copy{position:absolute;top:0;background-repeat:no-repeat}
/* code sticker (makeSticker): covers the whole code and keeps peeling back to show the last 3 characters */
.sk{position:absolute;z-index:4;pointer-events:none}
.sk i{display:block;font-style:normal;position:absolute}
.sk-under{position:absolute;background:var(--pri-tint);overflow:hidden}
.layer{--pri:#00ffa8;--pri-deep:#00c785;--pri-tint:#e6fff5}
.layer.cl2{--pri:#47a1c1;--pri-deep:#2f86a6;--pri-tint:#edf6f9}   /* Aramco, Figma "Client theme · colours" */
.sk-under b{position:absolute;font:700 24px/32px "Expo Arabic",sans-serif;color:#111;direction:ltr;white-space:nowrap}
.sk-cover{position:absolute;background:#111}
.sk-cover i{background-size:100% 100%}
.sk-shade{display:none}
.sk-flapw{position:absolute;left:-12px;top:-12px;right:-12px;bottom:-12px;filter:drop-shadow(-2px 2px 3px rgba(0,0,0,.3))}
.sk-flapw .sk-flap{inset:0;display:none}
.sk.c .sk-under,.sk.c .sk-shade,.sk.c .sk-flapw{display:none}
.sav{position:absolute;left:16px;width:196px;height:104px;background-size:100% 100%;z-index:3;pointer-events:none}
.sav svg{display:block}
/* Today's pick deck (makeDeck): HTML cards behind the Samsung flip card */
.tpc{position:absolute;width:398px;height:403px;z-index:6;touch-action:pan-y;display:none}
.tpc.on,.tpc.next{display:block}
.flip.tpc-flip:not(.on):not(.next){display:none}
.flip.next{z-index:5}
.flip.tpc-flip:not(.busy):not(.flipped) .face.front{opacity:1}   /* the deck moves it, so draw the front itself rather than rely on the Home image under it */
.tpc.next{z-index:5}
.tpc-card{position:absolute;left:20px;top:14px;width:358px;height:363px;background:#fff;border-radius:20px;box-shadow:0 4px 18px rgba(18,18,18,.06);overflow:hidden;direction:rtl}
.tpc-ph{position:absolute;left:8px;top:8px;width:342px;height:221px;border-radius:16px;background:#ddd center/cover no-repeat}
.tpc-fl{position:absolute;left:16px;top:16px;width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#111}
.tpc-fl .ic,.tpc-meta .ic{display:block;width:18px;height:18px}
.tpc-fl .ic svg,.tpc-meta .ic svg{width:18px;height:18px;stroke-width:2;display:block}
.tpc-tag{position:absolute;left:16px;top:197px;height:24px;width:78px;text-align:center;border-radius:12px;background:rgba(17,17,17,.7);color:#fff;font:700 12px/24px "NaN SuperX","Expo Arabic",sans-serif;white-space:nowrap}
.tpc-lg{position:absolute;left:275px;top:16px;width:67px;height:56px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center}
.tpc-lg i{display:block;width:55.4px;height:45px;background:center/contain no-repeat}
.tpc-m{position:absolute;left:16px;top:245px;width:326px;font:400 12px/16px "NaN SuperX","Expo Arabic",sans-serif;color:#62625c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpc-t{position:absolute;left:16px;top:266px;width:326px;font:700 16px/24px "NaN SuperX","Expo Arabic",sans-serif;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpc-d{position:absolute;right:16px;top:297px;height:24px;padding:0 8px;border-radius:12px;background:#00ffa8;color:#111;font:700 12px/24px "NaN SuperX","Expo Arabic",sans-serif;white-space:nowrap}
.tpc-meta{position:absolute;right:16px;top:329px;height:18px;display:flex;align-items:center;gap:4px;color:#62625c;font:400 12px/16px "NaN SuperX","Expo Arabic",sans-serif;white-space:nowrap}
.tpc-meta b{font-weight:400;margin:0 4px}
.tpdots{z-index:6}
/* voucher values on merchant C1 (makeVouPick) */
.vp{position:absolute;z-index:4}
.vp-val{background:#111;overflow:hidden;pointer-events:none}
.vp-num{position:absolute;right:0;top:0;height:100%;display:flex;align-items:center;gap:6.3px;direction:ltr;color:#fff;font:700 36px/44px "NaN SuperX",sans-serif;transition:opacity .2s,transform .2s}
.vp-num .riyal{width:26px;height:29.5px}
.vp-num.out{opacity:0;transform:translateY(-10px)}
.vp-num.in{opacity:0;transform:translateY(10px);transition:none}
.vp-chips{background:#fff}
.vp-chips button{all:unset;box-sizing:border-box;position:absolute;top:0;height:38px;border:1px solid #e6e6df;border-radius:999px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;gap:2.8px;direction:ltr;
  font:600 15px/18px "NaN SuperX",sans-serif;cursor:pointer;transition:background .2s,color .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.vp-chips button.on{background:#111;border-color:#111;color:#fff}
.vp-chips button i{font:600 12.5px/16px "NaN SuperX",sans-serif;font-style:normal;color:#009e6a;margin-right:3px}
.vp-chips button.on i{color:#00ffa8}
.vp-chips .riyal{width:10.7px;height:11.8px;position:relative;top:-.65px}
.vp-price{background:#fff;pointer-events:none}
.vp-pr{position:absolute;right:0;top:0;height:100%;display:flex;align-items:center;direction:rtl;color:#111}
.vp-pr b{font:700 20px/25px "NaN SuperX",sans-serif;margin-left:3px}
.vp-pr img{width:24px;height:25px;display:block}
.vp-pr s{font:400 16px/16px "NaN SuperX",sans-serif;color:#62625c;margin-right:8px;position:relative;top:.67px}
.vp-pr em{font:600 12.5px/16px "NaN SuperX",sans-serif;font-style:normal;background:#00ffa8;color:#111;border-radius:999px;height:20px;width:76px;justify-content:center;display:flex;align-items:center;margin-right:8px;white-space:nowrap}
/* Afiya cover on merchant C1 (makeCover) */
.cv{position:absolute;left:0;top:0;width:390px;height:330px;z-index:4;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cv i{display:block;font-style:normal}
.cv-clip{position:absolute;inset:0;overflow:hidden;clip-path:path('M0 0H390V330A28 28 0 0 0 362 302H28A28 28 0 0 0 0 330Z')}
.cv-ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;background-color:#e7713a;opacity:0;transition:opacity .6s ease}
.cv-ph.on{opacity:1;transform:scale(1.05);transition:opacity .6s ease,transform 3.4s linear}
.cv-ph.reset{transition:none!important}
.cv-scrim{position:absolute;left:0;top:0;width:390px;height:150px;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,0))}
.cv-sheet{position:absolute;left:0;top:302px;width:390px;height:120px;border-radius:28px 28px 0 0;box-shadow:0 -8px 24px rgba(18,18,18,.14)}
.cv-logo{position:absolute;left:306.67px;top:262.67px;width:69.67px;height:69.67px;border-radius:20.9px;background-size:100% 100%;box-shadow:0 7px 23px rgba(18,18,18,.14)}
.cv-sb{position:absolute;left:0;top:0;width:390px;height:42px;pointer-events:none}
.cv-sb svg{position:absolute;left:24px;top:14px}
.cv-sb b{position:absolute;left:338px;top:16px;font:600 15px/18px "NaN SuperX",sans-serif;color:#fff}
.cv-seg i{position:absolute;top:50px;width:68px;height:3px;border-radius:1.5px;background:rgba(255,255,255,.45);overflow:hidden;pointer-events:none}
.cv-seg b{position:absolute;right:0;top:0;height:100%;width:0;background:#fff}
.cv-btn{position:absolute;top:64px;height:40px;border-radius:20px;background-size:100% 100%;box-shadow:0 6px 20px rgba(18,18,18,.14)}
.cv-chip{position:absolute;left:16px;top:264px;width:74px;height:26px;box-sizing:border-box;padding:5px 10px;display:flex;justify-content:flex-end;align-items:center;gap:4px;border-radius:999px;
  background:rgba(17,17,17,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);color:#fff;font:500 12.5px/16px "NaN SuperX","Expo Arabic",sans-serif;direction:ltr;white-space:nowrap;pointer-events:none}
.cv-chip span{direction:rtl;position:relative;top:1px}
.cv-chip svg{flex:none;display:block}
.cv-zone{position:absolute;top:0;height:302px;width:195px;border-radius:0}
@media (prefers-reduced-motion:reduce){.cv-ph.on{transform:none}}
/* Home search: "ابحث عن" stays, the rest rolls (makeSearchRoll) */
.sx{position:absolute;left:32px;width:290px;height:28px;background:#fff;direction:rtl;display:flex;align-items:center;pointer-events:none;z-index:4;
  font:500 14px/20px "NaN SuperX","Expo Arabic",sans-serif;color:#62625c;white-space:nowrap}
.sx-fix{flex:none}
.sx-roll{position:relative;flex:1;height:28px;overflow:hidden}
.sx-w{position:absolute;right:0;top:4px;line-height:20px;opacity:0;transform:translateY(105%);
  transition:transform .55s cubic-bezier(.22,.9,.3,1),opacity .35s ease}
.sx-w.on{opacity:1;transform:none;transition:transform .55s cubic-bezier(.22,.9,.3,1),opacity .45s ease .08s}
.sx-w.out{opacity:0;transform:translateY(-105%)}
.sx-w.reset{transition:none}
.sx-w i{font:500 16px/20px "Noto Emoji",sans-serif;font-style:normal;color:#111;display:inline-block;vertical-align:top;margin-inline-start:3px}
@media (prefers-reduced-motion:reduce){.sx-w,.sx-w.out{transform:none}}
.dragging,.dragging *{cursor:grabbing!important}
.sticky{position:absolute;top:0;left:0;width:390px;height:153px;z-index:21;background-size:100% 100%;
  transform:translateY(-100%);transition:transform .25s ease}
.sticky.on{transform:none}
/* sheets */
.layer.sheet{background:transparent}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.layer.sheet.in .scrim{opacity:1}
.panel-sheet{position:absolute;left:0;bottom:0;width:390px;height:748px;background-size:100% 100%;
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.layer.sheet.in .panel-sheet{transform:none}
/* page transitions */
.layer.page{transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .25s}
.layer.page.from-left{transform:translateX(-100%)}
.layer.page.from-bottom{transform:translateY(100%)}
.layer.page.from-sheet{transform:translateY(96px);opacity:0}
.layer.page.fade{opacity:0}
.layer.page.behind{transform:translateX(28%)}
/* toast */
.toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,20px);background:rgba(17,17,17,.92);color:#fff;
  font:500 14px var(--ar);padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:99;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* flip */
.flip{position:absolute;perspective:1400px;z-index:6}
.flip .under-bg{position:absolute;left:20px;top:14px;width:358px;height:363px;border-radius:28px;opacity:0;transition:opacity .1s}
.flip.busy .under-bg,.flip.flipped .under-bg{opacity:1}
.flip .card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.flip.flipped .card{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-size:100% 100%}
.flip .back{transform:rotateY(180deg)}
.flip:not(.busy):not(.flipped) .face.front{opacity:0}
.flip.flipped .face.front,.flip:not(.flipped) .face.back{pointer-events:none}   /* a hidden face must not catch taps meant for the one in view */
/* points coin: every 5 s a band of light sweeps across the coin (masked to its silhouette), then a sparkle flashes on
   its rim (Tawaty, 22 Nov) */
.coin-fx{position:absolute;width:32px;height:32px;pointer-events:none;z-index:5}
.coin-fx .sw{position:absolute;inset:0;overflow:hidden;-webkit-mask:var(--cm) center/100% 100% no-repeat;mask:var(--cm) center/100% 100% no-repeat}
.coin-fx .sw::before{content:"";position:absolute;top:-40%;height:180%;left:4px;width:24px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.4) 26%,#fff 44%,#fff 56%,rgba(255,255,255,.4) 74%,rgba(255,255,255,0)) 0 0/100% 100% no-repeat,
    linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75) 50%,rgba(255,255,255,0)) 0 0/100% 100% no-repeat;
  background-size:24px 100%,6px 100%;background-position:0 0,30px 0;width:36px;
  transform:translateX(-50px) rotate(24deg);animation:coinSweep 5s cubic-bezier(.4,0,.3,1) infinite}
@keyframes coinSweep{0%,72%{transform:translateX(-50px) rotate(24deg)}94%,100%{transform:translateX(46px) rotate(24deg)}}
.coin-fx .sp{position:absolute;left:17px;top:-1px;width:15px;height:15px;opacity:0;animation:coinSpark 5s ease-out infinite}
.coin-fx .sp svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 2.5px rgba(255,255,255,.95))}
@keyframes coinSpark{0%,87%{opacity:0;transform:scale(.2) rotate(0)}92%{opacity:1;transform:scale(1) rotate(45deg)}100%{opacity:0;transform:scale(.3) rotate(90deg)}}
@media (prefers-reduced-motion: reduce){.coin-fx .sw::before,.coin-fx .sp{animation:none}}
/* balance */
.bal{position:absolute;left:16px;top:105px;width:362px;height:242px;background-size:100% 100%;z-index:7;
  clip-path:inset(0 0 152px 0 round 24px);opacity:0;transition:clip-path .32s cubic-bezier(.3,.7,.2,1),opacity .15s;pointer-events:none}
.bal.on{clip-path:inset(0 0 0 0 round 24px);opacity:1;pointer-events:auto}
/* peel */
.peel{position:absolute;z-index:8;overflow:hidden;border-radius:14px;pointer-events:none}
.peel .u,.peel .c{position:absolute;inset:0;background-repeat:no-repeat}
.peel .c{transform-origin:0% 100%}
.peel.go .c{animation:peel .75s cubic-bezier(.5,0,.3,1) forwards}
@keyframes peel{0%{transform:none}35%{transform:translate(-4px,-6px) rotate(-5deg)}100%{transform:translate(-420px,40px) rotate(-22deg);opacity:.2}}
.codebox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--pri-tint);border:1.5px dashed var(--pri-deep);border-radius:14px;
  font:700 24px "NaN SuperX",monospace;letter-spacing:.18em;color:#0d1714}
/* scanner */
.scanline{position:absolute;left:65px;top:210px;width:260px;height:260px;z-index:6;pointer-events:none;overflow:hidden;border-radius:18px}
.scanline::after{content:"";position:absolute;left:8%;right:8%;height:3px;top:0;background:#00ffa8;box-shadow:0 0 18px 4px rgba(0,255,168,.7);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 3px)}}
.clock{position:absolute;left:134px;top:47px;width:58px;height:19px;background:#111;color:#fff;z-index:6;direction:rtl;
  font:700 13px/19px "NaN SuperX",sans-serif;text-align:left;pointer-events:none;white-space:nowrap}
.sel-ring{position:absolute;border:2.5px solid #00c785;border-radius:18px;z-index:6;pointer-events:none}

  m_c1c: {h: 1169, label: 'Merchant C1 · one offer', cover: 1, hot: [back, fav, [61, 64, 40, 40, 'share'], [16, 493, 358, 224, 'offer'], [16, 1076, 358, 46, 'toast:terms']]},
  m_c2: {h: 1694, label: 'Merchant C2 · cashback', hot: [back, fav, [32, 624, 326, 45, 'toast:cashback'], [16, 740, 358, 120, 'toast:cashback'], [16, 1601, 358, 46, 'toast:terms']]},

/* ---------- logical entries → screens ---------- */
function resolve(e) {
  switch (e.t) {
    case 'home': return 'home' + cfg.home;
    case 'merchant': return 'm_' + (e.v || cfg.merchant);
    case 'offer': {
      let m = e.mode;
      if (m === 'online' && cfg.offer !== 'o2c') m = 'full';
      if (m === 'after' && cfg.offer !== 'o2b') m = 'tall';
      return cfg.offer + '_' + m;
    }
    case 'stores': return 'html_stores';
    case 'html': return 'html_' + e.key;
    default: return e.t;
  }
}

/* ---------- stack + rendering ---------- */
let stack = [];      // {t, mode, lens, flow, scanStart, revealed, el, id}
const dur = 360;

function makeHot(parent, a, ctx, dy = 0) {
  const [x, y, w, h, act] = a;
  const d = document.createElement('div');
  d.className = 'hs';
  Object.assign(d.style, {left: x + 'px', top: (y - dy) + 'px', width: w + 'px', height: h + 'px'});
  d.dataset.act = act;
  d.addEventListener('click', ev => { ev.stopPropagation(); if (dragMoved) return; act_(act, ctx, d); });
  parent.appendChild(d);
  return d;
}

function bgCss(name, w, yOff = 0) {
  return `url(${IMG(name)}) 0 ${-yOff}px / ${w || 390}px auto no-repeat`;
}

function build(entry) {
  CLIENT = cfg.home === '2' ? '_c2' : '';
  const id = resolve(entry);
  const s = SCR[id];
  entry.id = id;
  const el = document.createElement('div');
  const ctx = {entry, el, s};
  entry.ctx = ctx;
  if (s.html) { window.HTMLR[s.html](ctx); if (window.decorate) decorate(ctx); return el; }
  if (s.sheet) {
    el.className = 'layer sheet';
    const scrim = document.createElement('div'); scrim.className = 'scrim';
    scrim.addEventListener('click', () => act_('back', ctx));
    const p = document.createElement('div'); p.className = 'panel-sheet';
    p.style.backgroundImage = `url(${IMG(s.img)})`;
    s.hot.forEach(a => makeHot(p, a, ctx, 96));
    el.append(scrim, p);
    ctx.canvas = p; ctx.dy = 96;
    sheetGestures(p, ctx);
    if (entry.revealed && s.code) showRevealed(ctx); else if (s.code) offerSticker(ctx);
    if (window.decorate) decorate(ctx);
    return el;
  }
  el.className = 'layer page';
  if (CLIENT && (id === 'home2' || id === 'tp_success')) el.classList.add('cl2');   // client colours for the HTML parts too
  el.style.background = MAN.bg[s.img] || '#fff';
  const sc = document.createElement('div'); sc.className = 'scroll';
  const cv = document.createElement('div'); cv.className = 'canvas';
  ctx.scroll = sc; ctx.canvas = cv; ctx.dy = 0;
  const H = s.h;
  if (s.split) {
    const a = document.createElement('div'); a.className = 'seg-a';
    a.style.height = s.split + 'px'; a.style.backgroundImage = `url(${IMG(s.img)})`;
    const sp = document.createElement('div'); sp.className = 'spacer'; sp.style.backgroundImage = `url(${IMG(s.img + '_spacer')})`;
    const b = document.createElement('div'); b.className = 'seg-b';
    b.style.height = (H - s.split) + 'px'; b.style.backgroundImage = `url(${IMG(s.img)})`; b.style.backgroundPosition = `0 ${-s.split}px`;
    cv.append(a, sp, b);
    ctx.segA = a; ctx.segB = b; ctx.spacer = sp;
    const bal = document.createElement('div'); bal.className = 'bal'; bal.style.backgroundImage = `url(${IMG('bal_e')})`;
    makeHot(bal, [0, 0, 362, 242, 'bal'], ctx);
    bal.appendChild(makeCoinFx(310, 22));   // the coin on the open card (Figma 572:3551)
    a.appendChild(bal); ctx.bal = bal;
  } else {
    cv.style.height = H + 'px';
    cv.style.backgroundImage = `url(${IMG(s.img)})`;
  }
  const host = y => (s.split && y >= s.split) ? [ctx.segB, s.split] : [s.split ? ctx.segA : cv, 0];
  for (const a of s.hot) { const [p, dy] = host(a[1]); makeHot(p, a, ctx, dy); }

  if (s.map) { const [p, dy] = host(s.map.y); p.appendChild(makeHomeMap(s.map, ctx, dy)); }
  if (s.search) { const [p, dy] = host(s.search.y); p.appendChild(makeSearchRoll(s.search, dy)); }
  if (s.sav) { const [p, dy] = host(s.sav.y); p.appendChild(makeSavArcs(s.sav, dy)); }
  if (s.coin) { const [p, dy] = host(s.coin.y); p.appendChild(makeCoinFx(s.coin.x, s.coin.y - dy)); }
  if (s.cover) cv.appendChild(makeCover());
  if (s.vpick) makeVouPick(cv);
  if (s.pickRing) { const r = document.createElement('div'); r.className = 'sel-ring'; Object.assign(r.style, {left: '16px', top: s.pickRing + 'px', width: '358px', height: '84px'}); cv.appendChild(r); ctx.ring = r; }
  if (s.scanner) { const l = document.createElement('div'); l.className = 'scanline'; cv.appendChild(l); }
  if (s.clock) { const c = document.createElement('div'); c.className = 'clock'; cv.appendChild(c); ctx.clock = c; tickClock(c); }
  sc.appendChild(cv); el.appendChild(sc);
  // pinned parts

    const th = H - s.tab.top + 44;
    Object.assign(t.style, {bottom: 0, height: th + 'px', backgroundImage: `url(${IMG(s.tab.img)})`});
    s.tab.hot.forEach(a => makeHot(t, a, ctx, s.tab.top - 44));

  }
  if (s.actions) {
    const t = document.createElement('div'); t.className = 'fixed';
    const th = H - s.actions.y;
    Object.assign(t.style, {bottom: 0, height: th + 'px', background: bgCss(s.img, 390, s.actions.y)});
    s.actions.hot.forEach(a => makeHot(t, a, ctx, s.actions.y));
    el.appendChild(t);

  if (entry.revealed && s.code) showRevealed(ctx); else if (s.code) offerSticker(ctx);
  // tap on empty area: flash tappable spots
  el.addEventListener('click', () => { if (dragMoved) return; el.classList.remove('hint'); void el.offsetWidth; el.classList.add('hint'); setTimeout(() => el.classList.remove('hint'), 750); });
  dragScroll(sc, 'y');
  if (window.decorate) decorate(ctx);
  return el;
}

function makeRail(r, ctx, dy) {
  const w = 390 - r.minX;
  const box = document.createElement('div'); box.className = 'rail' + (r.snap ? ' snap' : '');
  // 2px of page colour above and below, so the still Home image never peeks out at the row's edges
  // (only where that edge is plain page; a banner right above a row is left alone)
  const [ct, cb] = (MAN.edge && MAN.edge[r.img]) || ['#000000', '#000000'];
  const light = c => Math.min(...[1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16))) > 200;
  const et = light(ct) ? 2 : 0, eb = light(cb) ? 2 : 0;
  Object.assign(box.style, {top: (r.y - dy - et) + 'px', height: (r.h + et + eb) + 'px', paddingTop: et + 'px', boxSizing: 'border-box',
    background: `linear-gradient(${ct} 0 50%, ${cb} 50% 100%)`});
  // a banner behind the rail's top rows stays still while the cards slide over it (food offers rail)
  const still = MAN.railbg && MAN.railbg[r.img];
  if (still) box.style.background = `url(${IMG(r.img + '_bg')}) 0 ${et - 2}px / 390px ${still + 2}px no-repeat, ${cb}`;   // the strip starts 2 px above the rail
  const inner = document.createElement('div'); inner.className = 'inner';
  Object.assign(inner.style, {width: w + 'px', height: r.h + 'px', backgroundImage: `url(${IMG(r.img)})`});
  const shift = a => [a[0] - r.minX, a[1], a[2], a[3], a[4]];
  if (r.snap) {
    const pts = r.pages ? r.pages.map(x => [x, 0, 358]) : r.cards.map(c => [c[0], 0, c[2]]);
    for (const [x, , cw] of pts) { const s = document.createElement('div'); s.className = 'snap-pt'; Object.assign(s.style, {position: 'absolute', left: (x - r.minX) + 'px', top: 0, width: cw + 'px', height: '1px'}); inner.appendChild(s); }
  }
  r.cards.forEach(c => makeHot(inner, shift(c), ctx));
  box.appendChild(inner);
  dragScroll(box, 'x');
  return box;
}

/* category rows: each row slides slowly in an endless loop (two copies of the row, one period apart).
   Drag or swipe a row left or right to move it yourself; a flick sets the direction the loop carries on in,
   and the row eases back to the slow speed. A touch without a drag holds the row still. */
const MQ_SPEED = 22;   // px per second, the slow loop
const MQ_EASE = 2.2;   // how fast a flick settles back to the slow speed (per second)
function makeMarquee(r, ctx, dy) {
  const box = document.createElement('div'); box.className = 'rail mq';
  const [ct, cb] = (MAN.edge && MAN.edge[r.img]) || ['#f0f8f3', '#f0f8f3'];
  const light = c => Math.min(...[1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16))) > 200;
  const et = light(ct) ? 2 : 0, eb = light(cb) ? 2 : 0;
  Object.assign(box.style, {top: (r.y - dy - et) + 'px', height: (r.h + et + eb) + 'px', background: `linear-gradient(${ct} 0 50%, ${cb} 50% 100%)`});
  const rows = {};
  r.cards.forEach(c => (rows[c[1]] = rows[c[1]] || []).push(c));
  const ys = Object.keys(rows).map(Number).sort((a, b) => a - b);
  const W = 390 - r.minX;
  const lanes = [];
  ys.forEach((y, i) => {
    const cs = rows[y].sort((a, b) => a[0] - b[0]);
    const h = cs[0][3], x0 = cs[0][0], x1 = Math.max(...cs.map(c => c[0] + c[2]));
    const gap = cs.length > 1 ? cs[1][0] - (cs[0][0] + cs[0][2]) : 8;
    const period = x1 - x0 + gap;
    const b0 = i === 0 ? 0 : (ys[i - 1] + rows[ys[i - 1]][0][3] + y) / 2;
    const b1 = i === ys.length - 1 ? r.h : (y + h + ys[i + 1]) / 2;
    const track = document.createElement('div'); track.className = 'mq-track';
    Object.assign(track.style, {left: x0 + 'px', top: (et + b0) + 'px', height: (b1 - b0) + 'px'});
    for (const off of [0, -period]) {
      const copy = document.createElement('div'); copy.className = 'mq-copy';
      Object.assign(copy.style, {left: off + 'px', width: period + 'px', height: (b1 - b0) + 'px',
        backgroundImage: `url(${IMG(r.img)})`, backgroundSize: `${W}px ${r.h}px`, backgroundPosition: `${-(x0 - r.minX)}px ${-b0}px`});
      cs.forEach(c => makeHot(copy, [c[0] - x0, c[1] - b0, c[2], c[3], c[4]], ctx));
      track.appendChild(copy);
    }
    box.appendChild(track);
    lanes.push({track, period, top: et + b0, bot: et + b1, o: 0, v: MQ_SPEED, dir: 1, held: false});
  });
  const paint = L => { const t = ((L.o % L.period) + L.period) % L.period; L.track.style.transform = `translateX(${t}px)`; };

  /* the loop runs only while this screen is on top */
  let last = 0, raf = 0, idle = 0;
  const live = () => { const t = top_(); return t && t.el && t.el === box.closest('.layer'); };
  const tick = now => {
    raf = 0;
    if (!box.isConnected) return;
    if (!live()) { last = 0; idle = setTimeout(wake, 400); return; }
    const dt = last ? Math.min(.05, (now - last) / 1000) : 0; last = now;
    for (const L of lanes) {
      if (L.held) continue;
      const goal = L.dir * MQ_SPEED;
      L.v = goal + (L.v - goal) * Math.exp(-MQ_EASE * dt);
      L.o += L.v * dt; paint(L);
    }
    raf = requestAnimationFrame(tick);
  };
  const wake = () => { clearTimeout(idle); if (!raf) raf = requestAnimationFrame(tick); };
  wake();

  /* drag: one pointer at a time, on the row under it */
  let g = null, seq = 0;
  const laneAt = ev => {
    const b = box.getBoundingClientRect(), y = (ev.clientY - b.top) / scale;
    return lanes.find(L => y >= L.top && y < L.bot) || lanes[y < lanes[0].top ? 0 : lanes.length - 1];
  };
  box.addEventListener('pointerdown', ev => {
    if (g || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
    ev.stopPropagation();   // keep the screen's own mouse drag-scroll out of it
    const L = laneAt(ev);
    g = {id: ev.pointerId, L, sx: ev.clientX, sy: ev.clientY, o0: L.o, axis: '', hist: [[performance.now(), L.o]],
         sc: ctx.scroll ? ctx.scroll.scrollTop : 0, mouse: ev.pointerType === 'mouse'};
    L.held = true; L.v = 0; dragMoved = false; seq++;
  });
  const move = ev => {
    if (!g || ev.pointerId !== g.id) return;
    const dx = (ev.clientX - g.sx) / scale, dyy = (ev.clientY - g.sy) / scale;
    if (!g.axis) {
      if (Math.hypot(dx, dyy) < 6) return;
      g.axis = Math.abs(dx) >= Math.abs(dyy) ? 'x' : 'y';
      dragMoved = true;
      if (g.axis === 'x') { document.body.classList.add('dragging'); try { box.setPointerCapture(ev.pointerId); } catch (e) {} }
      else if (!g.mouse) { end(ev); return; }   // touch: the page scrolls itself (pan-y)
    }
    if (g.axis === 'y') { if (ctx.scroll) ctx.scroll.scrollTop = g.sc - dyy; return; }
    g.L.o = g.o0 + dx; paint(g.L);
    const now = performance.now();
    g.hist.push([now, g.L.o]); while (g.hist.length > 2 && now - g.hist[0][0] > 120) g.hist.shift();
  };
  const end = ev => {
    if (!g || ev.pointerId !== g.id) return;
    const {L, hist, axis, o0} = g; g = null;
    document.body.classList.remove('dragging');
    L.held = false;
    if (axis === 'x') {
      const now = performance.now(), [ta, oa] = hist[0], [tb, ob] = hist[hist.length - 1];
      const v = (tb - ta) > 8 && now - tb < 100 ? Math.max(-1600, Math.min(1600, (ob - oa) / ((tb - ta) / 1000))) : 0;
      L.v = v;
      if (Math.abs(v) > 40) L.dir = Math.sign(v);             // a flick sets the direction
      else if (Math.abs(L.o - o0) > 24) L.dir = Math.sign(L.o - o0);   // so does a slow drag
    }
    const n = seq; setTimeout(() => { if (n === seq) dragMoved = false; }, 0);   // a quick re-grab keeps its own flag
    wake();
  };
  window.addEventListener('pointermove', move);
  ['pointerup', 'pointercancel'].forEach(e => window.addEventListener(e, end));
  box.addEventListener('lostpointercapture', end);
  return box;
}

/* Afiya cover (merchant C1): Tawaty's five photos play like stories, 3 s each, with the progress bars filling right to left.
   Tap the left half for the next photo and the right half for the previous one (RTL); a sideways swipe works too,
   and holding a finger on the photo pauses it. */
const CV_MS = 3000;
const CV_POS = ['50% 50%', '50% 100%', '50% 100%', '50% 100%', '50% 45%'];   // fitness, red velvet, chicken, brownie, meal plan
const CV_SIZE = ['cover', '106% auto', '112% auto', 'cover', 'cover'];   // a little extra zoom keeps the posters' titles out of view
const CV_SEG_X = [306, 233, 161, 88, 16];
function makeCover() {
  const n = CV_POS.length;
  const el = document.createElement('div'); el.className = 'cv';
  el.innerHTML = '<div class="cv-clip">' +
      CV_POS.map((p, i) => `<i class="cv-ph${i ? '' : ' on'}" style="background-image:url(${IMG('cv_' + (i + 1))});background-position:${p};background-size:${CV_SIZE[i]}"></i>`).join('') +
      `<i class="cv-scrim"></i><i class="cv-sheet"></i><i class="cv-logo" style="background-image:url(${IMG('cv_logo')})"></i>` +

    `<div class="cv-sb"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"><g><path d="M9.16667 9.16667V12.8333" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="white"/><path d="M12.8333 9.16667V12.8333" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="white"/><path d="M20.1667 12.8333V9.16667" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="white"/><path d="M5.5 9.16667V12.8333" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="white"/><path d="M3.66667 5.5H14.6667C15.6792 5.5 16.5 6.32081 16.5 7.33333V14.6667C16.5 15.6792 15.6792 16.5 14.6667 16.5H3.66667C2.65414 16.5 1.83333 15.6792 1.83333 14.6667V7.33333C1.83333 6.32081 2.65414 5.5 3.66667 5.5Z" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round" stroke="white"/></g></svg><b>9:41</b></div>` +
    '<div class="cv-seg">' + CV_SEG_X.map(x => `<i style="left:${x}px"><b></b></i>`).join('') + '</div>' +
    `<i class="cv-btn" style="left:334px;width:40px;background-image:url(${IMG('cv_back')})"></i>` +
    `<i class="cv-btn" style="left:16px;width:89px;background-image:url(${IMG('cv_pill')})"></i>` +
    `<div class="cv-chip"><span>${n} صور</span><svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><g><path d="M2.91667 1.75H11.0833C11.7277 1.75 12.25 2.27233 12.25 2.91667V11.0833C12.25 11.7277 11.7277 12.25 11.0833 12.25H2.91667C2.27233 12.25 1.75 11.7277 1.75 11.0833V2.91667C1.75 2.27233 2.27233 1.75 2.91667 1.75Z" stroke-width="1.16667" stroke-linecap="round" stroke-linejoin="round" stroke="white"/><path d="M6.41667 5.25C6.41667 5.89433 5.89433 6.41667 5.25 6.41667C4.60567 6.41667 4.08333 5.89433 4.08333 5.25C4.08333 4.60567 4.60567 4.08333 5.25 4.08333C5.89433 4.08333 6.41667 4.60567 6.41667 5.25Z" stroke-width="1.16667" stroke-linecap="round" stroke-linejoin="round" stroke="white"/><path d="M12.25 8.75L10.4498 6.94983C10.2311 6.73112 9.93436 6.60825 9.625 6.60825C9.31564 6.60825 9.01895 6.73112 8.80017 6.94983L3.5 12.25" stroke-width="1.16667" stroke-linecap="round" stroke-linejoin="round" stroke="white"/></g></svg></div>`;
  const ph = el.querySelectorAll('.cv-ph'), bars = el.querySelectorAll('.cv-seg b');

  const paint = () => bars.forEach((b, k) => b.style.width = (k < i ? 100 : k > i ? 0 : Math.min(100, t / CV_MS * 100)) + '%');
  const go = k => {
    k = (k + n) % n; if (k === i) { t = 0; paint(); return; }

    if (!held) { t += dt; if (t >= CV_MS) go(i + 1); else paint(); }
    raf = requestAnimationFrame(tick);
  };
  const wake = () => { clearTimeout(idle); if (!raf) raf = requestAnimationFrame(tick); };
  wake();
  /* tap, hold and swipe */
  let g = null;
  el.addEventListener('pointerdown', ev => {
    if (g || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
    const r = el.getBoundingClientRect();
    g = {id: ev.pointerId, x: ev.clientX, y: ev.clientY, t0: performance.now(), side: (ev.clientX - r.left) / scale < 195 ? 1 : -1};
    held = true;
  });
  const end = (ev, cancel) => {
    if (!g || ev.pointerId !== g.id) return;
    const dx = (ev.clientX - g.x) / scale, dy = (ev.clientY - g.y) / scale, dt = performance.now() - g.t0, side = g.side;
    g = null; held = false;
    if (cancel || dragMoved) return;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) go(i + (dx > 0 ? 1 : -1));   // swipe right brings the next photo in from the left
    else if (Math.hypot(dx, dy) < 10 && dt < 350) go(i + side);                              // tap: left half next, right half back
  };
  window.addEventListener('pointerup', ev => end(ev, false));
  window.addEventListener('pointercancel', ev => end(ev, true));
  el.addEventListener('click', ev => ev.stopPropagation());   // not an empty-area tap
  return el;
}

/* banner carousels turn on their own every 4 s; a touch pauses them for a while */
function autoCarousel(box, n, step, onIdx, ms = 4000) {
  let hold = 0;
  const idx = () => Math.min(n - 1, Math.round(Math.abs(box.scrollLeft) / step));
  const pause = () => { hold = Date.now() + 7000; };
  ['pointerdown', 'touchstart', 'wheel'].forEach(t => box.addEventListener(t, pause, {passive: true}));
  if (onIdx) box.addEventListener('scroll', () => onIdx(idx()), {passive: true});
  const t = setInterval(() => {
    if (!box.isConnected) return clearInterval(t);
    const top = top_();
    if (Date.now() < hold || document.hidden || !top || top.el !== box.closest('.layer')) return;
    box.scrollTo({left: -((idx() + 1) % n) * step, behavior: 'smooth'});
  }, ms);
}
function homeCarousel(box, r, p, dy) {
  const n = r.cards.length, step = r.cards[1][0] - r.cards[0][0];
  const d = document.createElement('div'); d.className = 'cdots';
  Object.assign(d.style, {top: (r.dots - dy) + 'px', background: ((MAN.edge && MAN.edge[r.img]) || [0, '#f0f8f3'])[1]});
  d.innerHTML = '<i class="on"></i>' + '<i></i>'.repeat(n - 1);
  p.appendChild(d);
  const dots = d.querySelectorAll('i');
  autoCarousel(box, n, step, i => dots.forEach((x, j) => x.classList.toggle('on', j === i)));
}

/* Code stickers (Tawaty, 22 Nov): the black "اكشف الكود" cover hides the whole code; it keeps peeling back from its
   right edge until the last 3 characters show, then lays flat again, in a smooth loop. The peeled part is the sticker's
   pale back, folded over and foreshortened as it lifts, with a soft shadow on the card. */
const SK_T = [1300, 650, 1300, 950];   // peel, hold, lay back, hold (ms)
const SK_LIFT = .5;                    // how much of the folded part shows (1 = folded flat)
function liveSticker(root) { const sk = [...root.querySelectorAll(':scope > .sk')].find(x => !x.classList.contains('c')); return sk || null; }
function offerSticker(ctx) {
  const [x, y, w, h] = ctx.s.code;
  ctx.canvas.appendChild(makeSticker({x, y: y - ctx.dy, w, h, inset: 8, label: 'sk_label', lx: 47, ly: 20, lw: 197, lh: 36, codeRight: 331, codeTop: 22,
    live: () => { const tp = top_(); return tp && tp.el && tp.el === ctx.el; }}));
}
function flyOff(sk, wrap) {
  sk._stop = true; sk._paint(0); sk.classList.add('c');
  Object.assign(sk.style, {left: '0px', top: '0px'});
  wrap.appendChild(sk);
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('go')));
}
function makeSticker(o) {
  const el = document.createElement('div'); el.className = 'sk';
  Object.assign(el.style, {left: o.x + 'px', top: o.y + 'px', width: o.w + 'px', height: o.h + 'px'});
  const i = o.inset, W = o.w - 2 * i, H = o.h - 2 * i, r = 24 - i, R = i + W, M = 12;
  const LIFT = o.lift || SK_LIFT;
  el.innerHTML = `<div class="sk-under" style="left:${i}px;top:${i}px;width:${W}px;height:${H}px;border-radius:${r}px">` +
      `<b style="right:${R - o.codeRight}px;top:${o.codeTop - i}px">WAL<span>A15</span></b></div>` +
    `<i class="sk-shade" style="left:${i}px;top:${i}px;width:${W}px;height:${H}px"></i>` +
    `<div class="sk-cover" style="left:${i}px;top:${i}px;width:${W}px;height:${H}px;border-radius:${r}px">` +
      `<i style="left:${o.lx - i}px;top:${o.ly - i}px;width:${o.lw}px;height:${o.lh}px;background-image:url(${IMG(o.label)})"></i></div>` +
    '<div class="sk-flapw"><i class="sk-flap"></i></div>';
  const cover = el.querySelector('.sk-cover'), shade = el.querySelector('.sk-shade'), flap = el.querySelector('.sk-flap'), tail = el.querySelector('.sk-under span');
  // rounded sticker outline, clockwise from the top-right corner (box coordinates)
  const outline = [];
  for (const [cx, cy, a0] of [[R - r, i + r, -90], [R - r, i + H - r, 0], [i + r, i + H - r, 90], [i + r, i + r, 180]])
    for (let k = 0; k <= 6; k++) { const a = (a0 + k * 15) * Math.PI / 180; outline.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  const rect = [[i, i], [R, i], [R, i + H], [i, i + H]];
  const half = (pts, T, B, sign) => {          // the part of a polygon on one side of the line T-B
    const f = P => ((B[0] - T[0]) * (P[1] - T[1]) - (B[1] - T[1]) * (P[0] - T[0])) * sign, out = [];
    pts.forEach((P, k) => { const Q = pts[(k + 1) % pts.length], fp = f(P), fq = f(Q);
      if (fp >= 0) out.push(P);
      if ((fp >= 0) !== (fq >= 0)) { const t = fp / (fp - fq); out.push([P[0] + (Q[0] - P[0]) * t, P[1] + (Q[1] - P[1]) * t]); } });
    return out;
  };
  const poly = (pts, dx, dy) => 'polygon(' + pts.map(([a, b]) => `${(a - dx).toFixed(2)}px ${(b - dy).toFixed(2)}px`).join(',') + ')';
  const grad = (dx, dy, w, h, sx, sy) => {     // CSS angle for direction (dx, dy) and where point (sx, sy) falls along it
    const ang = Math.atan2(dx, -dy), L = Math.abs(w * Math.sin(ang)) + Math.abs(h * Math.cos(ang));
    return [ang * 180 / Math.PI, (sx - (w / 2 - L / 2 * dx)) * dx + (sy - (h / 2 - L / 2 * dy)) * dy];
  };
  let reach = o.codeRight - 50;                // left edge of the last 3 characters, measured once the font is in
  const measure = () => {                      // layout offsets, so a 3D-turned card (Today's pick mid-flip) measures right
    const bb = tail.parentElement;
    if (tail.offsetWidth > 0) reach = i + bb.offsetLeft + tail.offsetLeft;
  };
  const paint = p => {
    if (p < .004) { cover.style.clipPath = ''; shade.style.display = flap.style.display = 'none'; return; }
    const xr = reach - 1;                                         // full peel: a straight fold just left of the last 3 characters
    const a = p * (R - xr), b = p * (H + (R - xr));               // it starts as a dog-ear at the top right corner
    const T = [R - a, i], B = b <= H ? [R, i + b] : [R - (b - H), i + H];
    const ux = B[0] - T[0], uy = B[1] - T[1], len = Math.hypot(ux, uy);
    let nx = uy / len, ny = -ux / len;                            // unit normal towards the lifted (right) side
    if ((R + 50 - T[0]) * nx + (i + H / 2 - T[1]) * ny < 0) { nx = -nx; ny = -ny; }
    const side = ux * (i + H / 2 - T[1]) - uy * (R + 50 - T[0]) > 0 ? 1 : -1;
    cover.style.clipPath = poly(half(rect, T, B, -side), i, i);  // the part still lying flat
    let ext = 0;
    const fl = half(outline, T, B, side).map(([px, py]) => {      // the lifted part, folded over and foreshortened
      const d = (px - T[0]) * nx + (py - T[1]) * ny; ext = Math.max(ext, d);
      return [px - (1 + LIFT) * d * nx, py - (1 + LIFT) * d * ny];
    });
    const e = ext * LIFT;
    const [fa, f0] = grad(-nx, -ny, o.w + 2 * M, o.h + 2 * M, T[0] + M, T[1] + M);
    Object.assign(flap.style, {display: 'block', clipPath: poly(fl, -M, -M),
      background: `linear-gradient(${fa.toFixed(2)}deg, #b6c4bd ${f0.toFixed(1)}px, #e8eeeb ${(f0 + 3).toFixed(1)}px, #fff ${(f0 + e * .55).toFixed(1)}px, #d3ddd8 ${(f0 + e + 1).toFixed(1)}px)`});
    const [sa, s0] = grad(nx, ny, W, H, T[0] - i, T[1] - i);
    Object.assign(shade.style, {display: 'block', clipPath: poly(half(rect, T, B, side), i, i),
      background: `linear-gradient(${sa.toFixed(2)}deg, rgba(0,50,30,.30) ${s0.toFixed(1)}px, rgba(0,50,30,.10) ${(s0 + 5).toFixed(1)}px, rgba(0,50,30,0) ${(s0 + 9 + 8 * p).toFixed(1)}px)`});
  };
  el._paint = paint;
  // the loop runs only while the sticker can be seen
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const total = SK_T.reduce((a, b) => a + b, 0);
  let t = 0, last = 0, raf = 0, idle = 0, measured = false;
  const tick = now => {
    raf = 0;
    if (!el.isConnected && t > 0) return;
    if (el._stop) return;
    if (!el.isConnected || !o.live()) { last = 0; idle = setTimeout(wake, 400); return; }
    if (!measured && (!document.fonts || document.fonts.status === 'loaded')) { measure(); measured = true; }
    const dt = last ? Math.min(100, now - last) : 0; last = now;
    t = (t + dt) % total || 1e-6;
    const [a, h1, b] = SK_T;
    paint(t < a ? ease(t / a) : t < a + h1 ? 1 : t < a + h1 + b ? 1 - ease((t - a - h1) / b) : 0);
    raf = requestAnimationFrame(tick);
  };
  const wake = () => { clearTimeout(idle); if (!raf && !el._stop) raf = requestAnimationFrame(tick); };
  wake();
  return el;
}

/* Today's pick deck (Tawaty, 22 Nov): "Swiping above this card will show the card behind it in a smooth shuffling

   HTML to the Figma front (565:2847). A sideways swipe either way sends the top card round to the back of the deck. */
const TP_CARDS = [
  {k: 'afiya', m: 'عافية', t: 'خصم ‎30% على جميع الوجبات الصحية', d: 'خصم ‎30%', ch: 'في الفروع', date: 'حتى 31 ديسمبر 2026'},

  {k: 'verve', m: 'فيرف سبا', t: 'خصم ‎30% على جلسات السبا', d: 'خصم ‎30%', ch: 'في الفروع', date: 'حتى 31 ديسمبر 2026', plate: '#e1cfb9'},
];
function tpCard(c, ctx, y) {

    `<div class="tpc-lg"${c.plate ? ` style="background:${c.plate}"` : ''}><i style="background-image:url(${IMG('tpc_' + c.k + '_logo')})"></i></div>` +
    `<div class="tpc-m">${c.m}</div><div class="tpc-t">${c.t}</div><div class="tpc-d">${c.d}</div>` +
    `<div class="tpc-meta">${ic(c.ico || 'map-pin')}<span>${c.ch}</span><b>·</b>${ic('calendar')}<span>${c.date}</span></div></div>`;
  makeHot(el.firstChild, [0, 0, 358, 363, 'tpOffer'], ctx);

}
const TP_OUT = 280, TP_BACK = 300;   // ms: swing out, then tuck in behind
function makeDeck(p, s, ctx, y, dotsY) {
  const f = makeFlip(s, ctx, y);
  const items = [f, ...TP_CARDS.map(c => tpCard(c, ctx, y))];
  items.forEach(el => p.appendChild(el));
  items[0].classList.add('on'); f.style.touchAction = 'pan-y';
  const d = document.createElement('div'); d.className = 'cdots tpdots';
  Object.assign(d.style, {top: (dotsY - 1) + 'px', height: '14px', background: MAN.bg[s.img + '_flip'] || '#f0f8f3'});   // baked dots: y 2713-2721
  d.innerHTML = items.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('');
  p.appendChild(d);
  const dots = [...d.children];
  let cur = 0, busy = false, g = null, seq = 0;
  const top = () => items[cur], nxt = () => items[(cur + 1) % items.length];
  const setNext = on => { items.forEach(el => el.classList.remove('next')); if (on) nxt().classList.add('next'); };
  const place = (el, dx) => { el.style.transform = dx ? `translateX(${dx}px) rotate(${dx * .035}deg)` : ''; };
  const settle = () => { const n = seq; setTimeout(() => { if (n === seq) dragMoved = false; }, 0); };
  function advance(dir) {
    busy = true;
    const out = top(), inn = nxt(), from = out.style.transform || 'none';
    setNext(true);
    inn.animate([{transform: 'translateY(10px) scale(.95)'}, {transform: 'none'}], {duration: TP_OUT + TP_BACK, easing: 'cubic-bezier(.2,.7,.2,1)'});
    const a = out.animate([{transform: from}, {transform: `translateX(${dir * 250}px) translateY(-6px) rotate(${dir * 10}deg)`}],
      {duration: TP_OUT, easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'forwards'});
    a.onfinish = () => {
      out.style.zIndex = 4;                              // now behind the new top card
      const b = out.animate([{transform: `translateX(${dir * 250}px) translateY(-6px) rotate(${dir * 10}deg)`}, {transform: 'translateY(14px) scale(.92)'}],
        {duration: TP_BACK, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards'});
      b.onfinish = () => {
        a.cancel(); b.cancel(); out.style.zIndex = ''; place(out, 0);
        out.classList.remove('on'); inn.classList.remove('next'); inn.classList.add('on');
        cur = (cur + 1) % items.length; dots.forEach((x, j) => x.classList.toggle('on', j === cur));

    const el = ev.currentTarget;
    if (busy || g || el !== top() || f.classList.contains('flipped') || f.classList.contains('busy') || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
    if (ev.pointerType === 'mouse') ev.stopPropagation();   // keep the page's mouse drag-scroll out of it
    g = {el, id: ev.pointerId, sx: ev.clientX, sy: ev.clientY, axis: '', dx: 0, t: performance.now(), sc: ctx.scroll ? ctx.scroll.scrollTop : 0, mouse: ev.pointerType === 'mouse'};
    seq++;
  };
  const move = ev => {
    if (!g || ev.pointerId !== g.id) return;
    const dx = (ev.clientX - g.sx) / scale, dy = (ev.clientY - g.sy) / scale;
    if (!g.axis) {
      if (Math.hypot(dx, dy) < 6) return;
      g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      dragMoved = true;
      if (g.axis === 'x') { try { g.el.setPointerCapture(ev.pointerId); } catch (e) {} setNext(true); g.el.style.transition = 'none'; }
      else if (!g.mouse) { g = null; settle(); return; }
    }
    if (g.axis === 'y') { if (ctx.scroll) ctx.scroll.scrollTop = g.sc - dy; return; }
    g.dx = dx; place(g.el, dx);
  };
  const up = ev => {
    if (!g || ev.pointerId !== g.id) return;
    const {el, axis, dx, t} = g; g = null; settle();
    if (axis !== 'x') return;
    const v = Math.abs(dx) / Math.max(1, performance.now() - t);
    if (Math.abs(dx) > 70 || (Math.abs(dx) > 24 && v > .45)) return advance(dx > 0 ? 1 : -1);
    el.style.transition = 'transform .25s cubic-bezier(.3,.7,.2,1)'; place(el, 0);
    setTimeout(() => { el.style.transition = ''; if (!busy) setNext(false); }, 260);
  };
  items.forEach(el => {
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });

}

/* ---------- stack operations ---------- */
function mount(entry, anim) {
  const el = build(entry);
  entry.el = el;
  if (anim && anim !== 'none' && !entry.enter) entry.enter = anim;
  phone.insertBefore(el, $('#toast'));
  if (entry.ctx.s.sheet) {
    if (anim === 'none') el.classList.add('in');
    else requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  } else if (anim && anim !== 'none') {
    el.classList.add(anim);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove(anim)));
  }
  onShow(entry);
  return el;
}
function unmount(entry, anim) {
  const el = entry.el; if (!el) return;
  clearTimeout(entry.timer); clearInterval(entry.ctx && entry.ctx.clockT);
  if (anim === 'none') { el.remove(); return; }
  if (entry.ctx.s.sheet) el.classList.remove('in');
  else el.classList.add(anim || 'from-left');
  setTimeout(() => el.remove(), dur);
}
function push(e, anim = 'from-left') {
  const top = stack[stack.length - 1];
  stack.push(e); mount(e, anim); update();
}
function pop(n = 1, anim) {
  for (let i = 0; i < n && stack.length > 1; i++) {
    const e = stack.pop(); unmount(e, i === n - 1 ? (anim || (e.ctx.s.sheet ? null : e.enter || 'from-left')) : 'none');
  }
  update();
}
function replaceTop(e, anim = 'fade') {
  const old = stack.pop(); stack.push(e);
  mount(e, anim);
  setTimeout(() => unmount(old, 'none'), anim === 'none' ? 0 : dur);
  update();
}
function resetTo(entries) {
  stack.forEach(e => unmount(e, 'none'));
  stack = entries; stack.forEach(e => mount(e, 'none')); update();
}
function rerenderAll() {
  const keep = stack.map(e => e.ctx && e.ctx.scroll ? e.ctx.scroll.scrollTop : 0);
  stack.forEach(e => unmount(e, 'none'));
  stack.forEach((e, i) => { mount(e, 'none'); if (e.ctx.scroll && resolve(e) === e.id) e.ctx.scroll.scrollTop = keep[i]; });
  update();
}
const top_ = () => stack[stack.length - 1];

function onShow(e) {
  const s = e.ctx.s;
  if (s.scanner) e.timer = setTimeout(() => { if (top_() === e) act_('scanned', e.ctx); }, 2600);
  if (e.scrollTo) setTimeout(() => e.ctx.scroll.scrollTo({top: e.scrollTo, behavior: 'smooth'}), 420);
}

function update() {
  const names = stack.map(e => e.label || (SCR[e.id] ? SCR[e.id].label : e.id));
  $('#crumb').textContent = names.join('  ›  ');
  stack.forEach((e, i) => e.el && (e.el.style.pointerEvents = i === stack.length - 1 ? '' : 'none'));
  if (window.onStack) onStack();
}

/* ---------- actions ---------- */
function act_(act, ctx, hsEl) {
  if (hsEl && hsEl.dataset.act !== act) act = hsEl.dataset.act;
  if (window.edgeAct && edgeAct(act, ctx, hsEl)) return;
  const [a, arg] = act.split(/:(.*)/s);
  const e = ctx.entry;
  switch (a) {
    case 'toast': return toast(arg);
    case 'fav': return toast('fav');
    case 'back':
      if (arg) toast(arg);
      if (stack.length > 1) pop(); else if (resolve(stack[0]) !== resolve({t: 'home'})) resetTo([{t: 'home'}]);
      return;
    case 'push': return push({t: arg});
    case 'tab':
      if (arg === 'home') return resetTo([{t: 'home'}]);
      if (arg === 'stores' || arg === 'near') return resetTo([{t: 'home'}, {t: 'stores', lens: 's1', root: 1}]);
      if (arg === 'wallet') return resetTo([{t: 'home'}, {t: 'h1'}]);
      return;
    case 'cats':   // a Home category chip opens Stores already drilled into that category
      return resetTo([{t: 'home'}, {t: 'stores', lens: 's1', root: 1, cat: arg}]);
    case 'stores': {
      if (e.t === 'stores') { e.lens = arg; return replaceTop({t: 'stores', lens: arg}, 'none'); }
      return push({t: 'stores', lens: arg});
    }
    case 'locOn': cfg.loc = true; $('#c-loc').checked = true; saveCfg(); return replaceTop({t: 'stores', lens: 's1'}, 'fade');
    case 'merchant': return openMerchant(arg === 'v' ? 1250 : 0);
    case 'cashStore': return push({t: 'merchant', v: 'c2'});   // the cashback card opens the cashback-only store screen
    case 'scrollTo': return ctx.scroll.scrollTo({top: +arg, behavior: 'smooth'});
    case 'offer': return push({t: 'offer', mode: 'tall', flow: 1});
    case 'expand': return replaceTop({t: 'offer', mode: cfg.offer === 'o2b' && e.revealed ? 'full' : 'full', flow: e.flow, revealed: e.revealed}, 'from-sheet');
    case 'collapse': return replaceTop({t: 'offer', mode: e.revealed && cfg.offer === 'o2b' ? 'after' : 'tall', flow: e.flow, revealed: e.revealed}, 'fade');
    case 'mode': {
      const anim = e.ctx.s.sheet ? 'from-sheet' : 'none';
      const n = {t: 'offer', mode: arg, flow: e.flow, revealed: e.revealed};
      replaceTop(n, anim);
      if (anim === 'none') n.ctx.scroll.scrollTop = ctx.scroll.scrollTop;
      return;
    }
    case 'scan': return push({t: 'r1', scanStart: 1});
    case 'scanTab': return push({t: 'r1', scanStart: 1, tabScan: 1}, 'from-bottom');
    case 'readyToUse': return push({t: 'r2', scanStart: 1}, 'from-bottom');
    case 'scanned': {
      if (top_() !== e) return;
      clearTimeout(e.timer);
      const next = e.tabScan ? 'r0' : cfg.result;
      return replaceTop({t: next, scanStart: 1, tabScan: e.tabScan}, 'fade');
    }
    case 'swap': return replaceTop({t: arg, scanStart: 1, tabScan: e.tabScan}, 'fade');
    case 'pick': if (ctx.ring) ctx.ring.style.top = hsEl.style.top; return;
    case 'finish': case 'finishTo': {
      let i = stack.length - 1;
      while (i > 0 && !stack[i].scanStart) i--;
      while (i > 0 && stack[i - 1].scanStart) i--;
      const n = stack.length - i;
      pop(n, 'from-bottom');
      if (arg === 'merchant') setTimeout(() => openMerchant(0), 60);
      return;
    }
    case 'reveal': {
      e.revealed = true;
      showRevealed(ctx, true);
      setTimeout(() => push({t: 'o2b_success', enter: 'fade', revealOf: e}, 'fade'), 950);
      return;
    }
    case 'revealDone': {
      if (arg) toast(arg);
      pop(1, 'fade');
      const p = top_();
      if (p.t === 'offer' && p.id === 'o2b_tall') replaceTop({t: 'offer', mode: 'after', flow: p.flow, revealed: true}, 'none');
      return;
    }
    case 'tpOffer': {   // the HTML Today's pick cards are branch offers: open the in-store offer sheet
      if (cfg.offer !== 'o2a') { cfg.offer = 'o2a'; saveCfg(); seg('c-offer', 'offer'); }
      return push({t: 'offer', mode: 'tall', flow: 1});
    }
    case 'flip': {
      const f = ctx.flip; f.classList.add('busy'); f.classList.toggle('flipped');
      clearTimeout(f._t); f._t = setTimeout(() => f.classList.remove('busy'), 650);
      return;
    }
    case 'tpReveal': {
      stackTpRevealed = true;
      addTpCode(ctx.tpBack, true);
      setTimeout(() => push({t: 'tp_success', enter: 'fade'}, 'fade'), 950);
      return;
    }
    case 'bal': {
      const on = !ctx.bal.classList.contains('on');
      ctx.bal.classList.toggle('on', on); ctx.spacer.style.height = on ? '152px' : '0';
      return;
    }
  }
}

function openMerchant(scrollTo) {
  // if a merchant page sits right under the current offer sheet, go back to it
  const t = top_();
  const below = stack[stack.length - 2];
  if (t.t === 'offer' && below && below.t === 'merchant') { pop(); if (scrollTo) below.ctx.scroll.scrollTo({top: scrollTo, behavior: 'smooth'}); return; }
  if (t.t === 'offer') { replaceTop({t: 'merchant', scrollTo: cfg.merchant === 'c1a' ? scrollTo : 0}, 'from-left'); return; }
  push({t: 'merchant', scrollTo: cfg.merchant === 'c1a' ? scrollTo : 0});
}

/* ---------- clock ---------- */
function tickClock(c) {
  const f = () => {
    const d = new Date(); let h = d.getHours(); const am = h < 12; h = h % 12 || 12;
    const p = n => String(n).padStart(2, '0');
    c.textContent = `${h}:${p(d.getMinutes())}:${p(d.getSeconds())} ${am ? 'ص' : 'م'}`;
  };
  f(); const t = setInterval(() => { if (!c.isConnected) return clearInterval(t); f(); }, 1000);
}

/* ---------- gestures ---------- */
let dragMoved = false;
function dragScroll(el, axis) {
  let sx, sy, sl, st, down = false;
  el.addEventListener('pointerdown', ev => {
    if (ev.pointerType !== 'mouse' || ev.button !== 0) return;
    down = true; dragMoved = false; sx = ev.clientX; sy = ev.clientY; sl = el.scrollLeft; st = el.scrollTop;
    ev.stopPropagation();
  });
  window.addEventListener('pointermove', ev => {
    if (!down) return;
    const k = scale;
    const dx = (ev.clientX - sx) / k, dy = (ev.clientY - sy) / k;
    if (!dragMoved && Math.hypot(dx, dy) > 6) { dragMoved = true; document.body.classList.add('dragging'); if (axis === 'x') el.style.scrollSnapType = 'none'; }
    if (dragMoved) { if (axis === 'x') el.scrollLeft = sl - dx; else el.scrollTop = st - dy; }
  });
  window.addEventListener('pointerup', () => {
    if (!down) return; down = false; document.body.classList.remove('dragging');
    if (axis === 'x' && el.classList.contains('snap')) { el.style.scrollSnapType = ''; }
    setTimeout(() => dragMoved = false, 0);
  });
}
function sheetGestures(p, ctx) {
  let y0 = null;
  p.addEventListener('wheel', ev => { ev.preventDefault(); if (top_() !== ctx.entry) return; if (ev.deltaY > 12) act_('expand', ctx); else if (ev.deltaY < -24) act_('back', ctx); }, {passive: false});
  p.addEventListener('touchstart', ev => { y0 = ev.touches[0].clientY; }, {passive: true});
  p.addEventListener('touchend', ev => {
    if (y0 == null || top_() !== ctx.entry) return; const d = ev.changedTouches[0].clientY - y0; y0 = null;
    if (d < -40) act_('expand', ctx); else if (d > 60) act_('back', ctx);
  });
}

/* ---------- controls ---------- */
function seg(id, key) {
  const box = $('#' + id);
  box.innerHTML = '';
  for (const [v, l, sub] of OPTS[key]) {
    const b = document.createElement('button'); b.innerHTML = l + (sub ? `<small>${sub}</small>` : '');
    b.className = cfg[key] === v ? 'on' : '';
    b.onclick = () => { cfg[key] = v; saveCfg(); seg(id, key); onCfg(key); };
    box.appendChild(b);
  }
}
function onCfg(key) {
  if (key === 'result') return;
  // jump to where the change shows
  const has = t => stack.some(e => e.t === t);
  if (key === 'home' && !has('home')) return rerenderAll();
  if (key === 'sav') { if (cfg.home === '3') { cfg.home = '1'; saveCfg(); seg('c-home', 'home'); } return resetTo([{t: 'home'}]); }
  if (key === 'merchant' && !has('merchant')) return resetTo([{t: 'home'}, {t: 'merchant'}]);
  if (key === 'offer' && !has('offer')) return resetTo([{t: 'home'}, {t: 'merchant'}, {t: 'offer', mode: 'tall', flow: 1}]);
  stack.forEach(e => { if (e.t === 'offer') e.revealed = false; });
  rerenderAll();
}
seg('c-home', 'home'); seg('c-sav', 'sav'); seg('c-merchant', 'merchant'); seg('c-offer', 'offer'); seg('c-result', 'result');
$('#c-loc').checked = cfg.loc;
$('#c-loc').onchange = ev => { cfg.loc = ev.target.checked; saveCfg(); if (stack.some(e => e.t === 'stores')) rerenderAll(); else resetTo([{t: 'home'}, {t: 'stores', lens: 's1'}]); };
$('#c-hs').checked = cfg.hs; phone.classList.toggle('show-hs', cfg.hs);
$('#c-hs').onchange = ev => { cfg.hs = ev.target.checked; saveCfg(); phone.classList.toggle('show-hs', cfg.hs); };
$('#b-back').onclick = () => act_('back', top_().ctx);
$('#b-reset').onclick = () => { stackTpRevealed = false; resetTo([{t: 'home'}]); };
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' || ev.key === 'Backspace') { ev.preventDefault(); act_('back', top_().ctx); } });

// screen index
(function () {
  const idx = $('#idx');
  const groups = [
    ['Home', [['home', {t: 'home'}, 'Home (current version)'], ['wallet', {t: 'h1'}, 'H1 · used offers'], ['h2', {t: 'h2'}, 'H2 · one use'], ['tp', {t: 'tp_success'}, 'Today\'s pick · revealed']]],
    ['Stores', [['s1', {t: 'stores', lens: 's1'}, 'Feed'], ['s3', 's3', 'Location off'], ['s4', {t: 'stores', lens: 's4', preset: 's4'}, 'Offers · 1+1 in food'], ['s5', {t: 'stores', lens: 's5'}, 'Cashback lens'], ['s6', {t: 'stores', lens: 's6'}, 'Vouchers lens']]],
    ['Merchant', OPTS.merchant.map(([v, l]) => [v, {merchant: v}, l])],
    ['Offer', [['a', {offer: 'o2a'}, 'O2a · sheet'], ['af', {offer: 'o2a', mode: 'full'}, 'O2a · full'], ['b', {offer: 'o2b'}, 'O2b · sheet'], ['bf', {offer: 'o2b', mode: 'full'}, 'O2b · full'], ['bs', 'o2b_success', 'O2b · revealed'], ['ba', {offer: 'o2b', mode: 'after'}, 'O2b · after reveal'], ['c', {offer: 'o2c'}, 'O2c · sheet'], ['cf', {offer: 'o2c', mode: 'full'}, 'O2c · in-store tab'], ['co', {offer: 'o2c', mode: 'online'}, 'O2c · online tab']]],
    ['Using an offer', [['r1', 'r1', 'R1 · scan'], ['r0', 'r0', 'R0 · pick offer'], ['r2', 'r2', 'R2 · counted + code'], ['r3', 'r3', 'R3 · cashier can\'t'], ['f1', 'f1', 'F1'], ['f2', 'f2', 'F2'], ['f3', 'f3', 'F3'], ['f4', 'f4', 'F4']]],
  ];
  for (const [g, items] of groups) {
    const b = document.createElement('b'); b.textContent = g; idx.appendChild(b);
    for (const [, target, label] of items) {
      const bt = document.createElement('button'); bt.textContent = label;
      bt.onclick = () => jump(target); idx.appendChild(bt);
    }
  }
})();
function jump(t) {
  if (typeof t === 'string') {
    const flow = ['r1', 'r0', 'r2', 'r3', 'f1', 'f2', 'f3', 'f4'].includes(t);
    if (t === 's3') { cfg.loc = false; $('#c-loc').checked = false; saveCfg(); return resetTo([{t: 'home'}, {t: 'stores', lens: 's1'}]); }
    if (t === 'o2b_success') { cfg.offer = 'o2b'; saveCfg(); seg('c-offer', 'offer'); return resetTo([{t: 'home'}, {t: 'merchant'}, {t: 'offer', mode: 'tall', flow: 1, revealed: true}, {t: 'o2b_success', enter: 'fade'}]); }
    return resetTo([{t: 'home'}, {t: 'merchant'}, ...(flow ? [{t: 'offer', mode: 'tall', flow: 1}] : []), {t, scanStart: flow ? 1 : 0, tabScan: t === 'r0'}]);
  }
  if (t.merchant) { cfg.merchant = t.merchant; saveCfg(); seg('c-merchant', 'merchant'); return resetTo([{t: 'home'}, {t: 'merchant'}]); }
  if (t.offer) {
    cfg.offer = t.offer; saveCfg(); seg('c-offer', 'offer');
    const m = t.mode || 'tall';
    return resetTo([{t: 'home'}, {t: 'merchant'}, {t: 'offer', mode: m, flow: 1, revealed: m === 'after'}]);
  }
  if (t.t === 'home') return resetTo([{t: 'home'}]);
  if (t.t === 'stores' && t.lens === 's1') { cfg.loc = true; $('#c-loc').checked = true; saveCfg(); }
  return resetTo([{t: 'home'}, Object.assign({}, t)]);
}

/* ---------- fit the phone ---------- */
let scale = 1;
const FULL = () => matchMedia('(max-width: 600px)').matches && !/[?&]frame\b/.test(location.search);
function fit() {
  const wrap = $('#wrap');
  if (FULL()) {
    // phone-sized screen: no frame, no panel; the app fills the screen edge to edge
    document.body.classList.add('full');
    scale = innerWidth / 390;
    phone.style.height = Math.ceil(innerHeight / scale) + 'px';
    phone.style.transform = `scale(${scale})`;
    wrap.style.width = innerWidth + 'px'; wrap.style.height = innerHeight + 'px';
    return;
  }
  document.body.classList.remove('full', 'ctl-open');
  phone.style.height = '';
  const narrow = window.innerWidth <= 760;
  const availH = narrow ? Infinity : window.innerHeight - 90;
  const availW = narrow ? window.innerWidth - 56 : 430;
  scale = Math.min(1, availH / 844, availW / 390);
  scale = Math.max(scale, .5);
  phone.style.transform = `scale(${scale})`;
  wrap.style.width = 390 * scale + 'px'; wrap.style.height = 844 * scale + 'px';
}
addEventListener('resize', fit); fit();
$('#ctl').addEventListener('click', () => { const o = document.body.classList.toggle('ctl-open'); $('#ctl span').textContent = o ? 'Close' : 'Controls'; });
// on a phone, picking anything in the controls shows the result straight away
document.querySelector('.panel').addEventListener('click', ev => {
  if (!document.body.classList.contains('full') || !ev.target.closest('button') || ev.target.closest('summary')) return;
  setTimeout(() => { document.body.classList.remove('ctl-open'); $('#ctl span').textContent = 'Controls'; }, 150);
});

resetTo([{t: 'home'}]);

/* warm the cache with every screen, a few at a time, so taps open instantly */
addEventListener('load', () => {
  const q = Object.keys(MAN.img).map(IMG);
  const next = () => { const u = q.shift(); if (!u) return; const i = new Image(); i.decoding = 'async'; i.onload = i.onerror = next; i.src = u; };
  setTimeout(() => { for (let k = 0; k < 3; k++) next(); }, 800);
});
